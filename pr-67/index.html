ore --config-dir bob   call chat_module status\n```\n\n`status()` returns the `Status` record directly under `result`\n(`{\"status\":\"ok\",\"result\":{\"delivery_state\":\"online\",...}}`), unlike the\n`result`-bearing methods below, which nest their payload one level deeper."}, {"execs": [], "md": "## Step 5: The round-trip\n\nAlice shares her address, Bob opens a DirectV1 conversation with her, Alice\njoins via the invite, then Bob sends the first message and Alice replies \u2014 a\nbidirectional round-trip between two independent headless instances."}, {"execs": [{"cmd": "out=$(./logos/bin/logoscore --config-dir alice call chat_module get_address)\necho \"$out\"\necho \"$out\" | jq -j '.result' > alice-addr.txt\necho \"alice address: $(cat alice-addr.txt)\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"get_address\",\"module\":\"chat_module\",\"result\":\"de7530f0abc978fb8f0f1a9187f8044b4bc4ca888169a13775c18f8c69b76870\",\"status\":\"ok\"}\nalice address: de7530f0abc978fb8f0f1a9187f8044b4bc4ca888169a13775c18f8c69b76870\n", "status": "pass"}], "md": "### 5.1 Alice publishes her address\n\n```bash\nlogoscore --config-dir alice call chat_module get_address | jq -j '.result' > alice-addr.txt\n```\n\n`get_address` returns the LIDL `tstr` type, so its payload is the string\ndirectly at `.result` \u2014 Alice's installation address, what a peer needs to\nopen a conversation with her. Her key package was published to the registry\nduring `init`, so the address alone lets Bob reach her."}, {"execs": [{"cmd": "out=$(./logos/bin/logoscore --config-dir bob call chat_module create_conversation @alice-addr.txt)\necho \"$out\"\necho \"$out\" | jq -e '.result.success == true' >/dev/null || { echo \"create_conversation failed: $out\" >&2; exit 1; }\necho \"$out\" | jq -j '.result.value' > bob-convo.txt\necho \"bob convo: $(cat bob-convo.txt)\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"create_conversation\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":\"b7509a4754a4f960c8e5148dc4fe1491\"},\"status\":\"ok\"}\nbob convo: b7509a4754a4f960c8e5148dc4fe1491\n", "status": "pass"}], "md": "### 5.2 Bob opens a conversation with Alice\n\n```bash\nlogoscore --config-dir bob call chat_module create_conversation @alice-addr.txt\n```\n\n`@alice-addr.txt` feeds Alice's address as the argument. Bob fetches her\nkey package from the registry and sends her an MLS invite; `result.value`\nis Bob's conversation id. The first message is sent separately, once Alice\nhas joined."}, {"execs": [{"cmd": "for i in $(seq 1 50); do\n  cid=$(./logos/bin/logoscore --config-dir alice call chat_module list_conversations 2>/dev/null | jq -r '.result[0].convo_id // empty')\n  if [ -n \"$cid\" ]; then echo \"$cid\" > alice-convo.txt; echo \"ALICE_HAS_CONVO $cid\"; break; fi\n  sleep 3\ndone\n[ -s alice-convo.txt ] || { echo \"alice never joined the conversation\" >&2; exit 1; }\n", "exit_code": 0, "kind": "run", "note": "", "output": "ALICE_HAS_CONVO b7509a4754a4f960c8e5148dc4fe1491\n", "status": "pass"}], "md": "### 5.3 Alice joins the conversation\n\n```bash\n# poll until Alice has processed the invite and joined\nlogoscore --config-dir alice call chat_module list_conversations | jq -r '.result[0].convo_id'\n```\n\nDirectV1 is group-based, so both sides share one conversation id (the\ngroup id) \u2014 unlike PrivateV1's asymmetric ids. Once the conversation\nappears, Alice has joined and subscribed to its delivery address, so she\nis ready to receive messages on it."}, {"execs": [{"cmd": "cid=$(cat bob-convo.txt)\n./logos/bin/logoscore --config-dir bob call chat_module send_message \"$cid\" hello-from-bob\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"send_message\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.4 Bob sends the first message\n\n```bash\nlogoscore --config-dir bob call chat_module send_message \"$BOB_CONVO\" hello-from-bob\n```\n\nBob sends only after Alice has joined (previous step), so the message\nreaches her subscribed thread rather than racing ahead of her join."}, {"execs": [{"cmd": "cid=$(cat alice-convo.txt)\nfor i in $(seq 1 50); do\n  msgs=$(./logos/bin/logoscore --config-dir alice call chat_module get_messages \"$cid\" 2>/dev/null || true)\n  case \"$msgs\" in *'\"content\":\"hello-from-bob\"'*) echo \"ALICE_GOT_BOB_MSG\"; exit 0;; esac\n  sleep 3\ndone\necho \"alice never received bob's message\" >&2; exit 1\n", "exit_code": 0, "kind": "run", "note": "", "output": "ALICE_GOT_BOB_MSG\n", "status": "pass"}], "md": "### 5.5 Alice receives Bob's message\n\n```bash\nlogoscore --config-dir alice call chat_module get_messages \"$ALICE_CONVO\"\n```\n\nDirectV1 gives both sides the **same** conversation id (the MLS group id).\nReceived messages are persisted and surface via `get_messages` with no\nevent subscription; `list_conversations` / `get_messages` return their\narrays directly under `result`."}, {"execs": [{"cmd": "cid=$(cat alice-convo.txt)\n./logos/bin/logoscore --config-dir alice call chat_module send_message \"$cid\" hi-bob-got-it\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"send_message\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.6 Alice replies\n\n```bash\nlogoscore --config-dir alice call chat_module send_message \"$ALICE_CONVO\" hi-bob-got-it\n```"}, {"execs": [{"cmd": "cid=$(cat bob-convo.txt)\nfor i in $(seq 1 50); do\n  msgs=$(./logos/bin/logoscore --config-dir bob call chat_module get_messages \"$cid\" 2>/dev/null || true)\n  case \"$msgs\" in *'\"content\":\"hi-bob-got-it\"'*) echo \"BOB_GOT_REPLY\"; exit 0;; esac\n  sleep 3\ndone\necho \"bob never received alice's reply\" >&2; exit 1\n", "exit_code": 0, "kind": "run", "note": "", "output": "BOB_GOT_REPLY\n", "status": "pass"}], "md": "### 5.7 Bob receives Alice's reply\n\n```bash\nlogoscore --config-dir bob call chat_module get_messages \"$BOB_CONVO\"\n```\n\nThe same path in reverse: a real bidirectional, end-to-end-encrypted\nround-trip between two independent headless `chat_module` instances."}, {"execs": [], "md": "## Step 6: Stop the daemons"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir alice stop || true\n./logos/bin/logoscore --config-dir bob   stop || true\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 6.1 Shut both down gracefully\n\n```bash\nlogoscore --config-dir alice stop\nlogoscore --config-dir bob   stop\n```\n\nAlways stop through the control socket rather than killing the process group: two daemons share one shell here."}]}, {"meta": {"name": "Headless three-instance group conversation", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Headless three-instance group conversation\n\nThis tutorial shows `chat_module`'s group API end to end, by example. A\nGroupV2 conversation starts with its creator as the only member and grows\none peer at a time: the creator (or any existing member) invites a peer by\naddress, the group's steward commits the add, and the invited instance joins\nonce the welcome reaches it. Every member sees the **same** conversation id,\nand each received message carries the sender's directory-verified account\naddress.\n\nSo the tutorial runs three headless [`logoscore`](https://github.com/logos-co/logos-logoscore-cli)\ndaemons (Alice, Bob, and Carol), each loading `chat_module` and its runtime\ndependency `delivery_module`, and drives them through the `logoscore call`\nCLI: `init`, `get_address`, `create_group_conversation`, `add_group_member`,\n`send_message`, and reading the shared thread back with\n`list_conversations` / `get_messages`.\n\nGroup membership changes are **asynchronous by design**: an add is first\nagreed by the group (a consensus proposal), then batched into an MLS commit\nby the group's steward after a commit-inactivity window, and only then does\nthe welcome go out. With the default de-mls timing that window is 60s, so\nexpect a join to land minutes after the `add_group_member` call over the\nlive network \u2014 the poll loops below are budgeted for that.\n\n**What you'll build:** A verified three-member, end-to-end-encrypted group conversation across three headless chat_module instances, grown member by member, with sender-attributed message fan-out.\n\n**What you'll learn:**\n\n- Run three isolated `logoscore` daemons on one host, selected by `--config-dir`\n- Create a named group with `create_group_conversation` and grow it with `add_group_member` \u2014 including an add proposed by a non-creator member\n- Why a group join lands asynchronously (consensus + steward commit + welcome), and how to observe it by polling `list_conversations`\n- How every member shares one conversation id, and how `get_messages` attributes each inbound message to its sender's account address\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, cargo, rustc) during the builds.\n- **`jq`** on `PATH` (used to read the JSON the CLI prints). GitHub runners ship it; locally, run the spec inside `nix shell nixpkgs#jq`.\n- **Network access.** The three delivery nodes discover each other over the `logos.test` Waku fleet; an isolated sandbox won't complete the exchange. Expect ~5-40s to reach Online, minutes per membership change, and up to ~2 min for messages to propagate."}, {"execs": [], "md": "## Step 1: Build the tools and the two modules\n\nTwo tools drive the exchange: `logoscore` (the headless module runtime,\nwhich also bundles `capability_module` under `logos/modules/`) and `lgpm`\n(the package installer). Then the two modules the daemons load:\n`chat_module`, and its runtime dependency `delivery_module`."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-logoscore-cli' --out-link ./logos", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.1 Build logoscore\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli' --out-link ./logos\n```"}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-package-manager#cli' -o lgpm", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.2 Build lgpm\n\n```bash\nnix build 'github:logos-co/logos-package-manager#cli' -o lgpm\n```"}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-chat-module/3e739d8bf58b1745f23f97a3d4336705b19e6092#lgx\" -o chat-lgx", "exit_code": 0, "kind": "run", "note": "", "output": "warning: ignoring untrusted flake configuration setting 'extra-substituters'.\nPass '--accept-flake-config' to trust it\nwarning: ignoring untrusted flake configuration setting 'extra-trusted-public-keys'.\nPass '--accept-flake-config' to trust it\n", "status": "pass"}], "md": "### 1.3 Build chat_module (the commit under test)\n\n```bash\nnix build 'github:logos-co/logos-chat-module#lgx' -o chat-lgx\n```"}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-chat-module/3e739d8bf58b1745f23f97a3d4336705b19e6092#delivery_module-lgx\" -o delivery-lgx", "exit_code": 0, "kind": "run", "note": "", "output": "warning: ignoring untrusted flake configuration setting 'extra-substituters'.\nPass '--accept-flake-config' to trust it\nwarning: ignoring untrusted flake configuration setting 'extra-trusted-public-keys'.\nPass '--accept-flake-config' to trust it\n", "status": "pass"}], "md": "### 1.4 Build delivery_module (chat_module's runtime dependency)\n\n```bash\nnix build 'github:logos-co/logos-chat-module#delivery_module-lgx' -o delivery-lgx\n```\n\nBuilt from `chat_module`'s own flake, so the running `delivery_module`\nis the exact rev `chat_module` is built against."}, {"execs": [], "md": "## Step 2: Assemble the modules directory\n\nAll three daemons load from one shared modules directory: the\n`capability_module` that ships with `logoscore`, plus the two `.lgx`s\ninstalled on top."}, {"execs": [{"cmd": "mkdir -p modules\ncp -RL ./logos/modules/. ./modules/\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file delivery-lgx/*.lgx\n./lgpm/bin/lgpm --modules-dir ./modules --allow-unsigned install --file chat-lgx/*.lgx\n", "exit_code": 0, "kind": "run", "note": "", "output": "Installing from file: delivery-lgx/logos-delivery_module-module-lib.lgx... done\nInstalled to: ./modules\nInstalling from file: chat-lgx/logos-chat_module-module-lib.lgx... done\nInstalled to: ./modules\n", "status": "pass"}], "md": "### 2.1 Install the bundled and built modules\n\n```bash\nmkdir -p modules\ncp -RL ./logos/modules/. ./modules/                       # bundled capability_module\nlgpm --modules-dir ./modules --allow-unsigned install --file delivery-lgx/*.lgx\nlgpm --modules-dir ./modules --allow-unsigned install --file chat-lgx/*.lgx\n```"}, {"execs": [], "md": "## Step 3: Start three isolated daemons\n\nOne module is a per-host singleton inside a daemon, so Alice, Bob, and\nCarol are **separate daemons**, kept apart by `--config-dir` (control\nsocket, client token, persistence, and the per-instance directory each daemon\nassigns its `chat_module`). Their delivery nodes need no such scoping: each\npicks its own listening ports."}, {"execs": [{"cmd": "sh -c './logos/bin/logoscore --config-dir alice -D -m ./modules > alice-daemon.log 2>&1 &'\nsh -c './logos/bin/logoscore --config-dir bob   -D -m ./modules > bob-daemon.log 2>&1 &'\nsh -c './logos/bin/logoscore --config-dir carol -D -m ./modules > carol-daemon.log 2>&1 &'\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.1 Start the three daemons\n\n```bash\nlogoscore --config-dir alice -D -m ./modules > alice-daemon.log &\nlogoscore --config-dir bob   -D -m ./modules > bob-daemon.log &\nlogoscore --config-dir carol -D -m ./modules > carol-daemon.log &\n```"}, {"execs": [{"cmd": "for who in alice bob carol; do\n  up=\"\"\n  for i in $(seq 1 30); do\n    if ./logos/bin/logoscore --config-dir \"$who\" list-modules >/dev/null 2>&1; then\n      up=1; echo \"${who}_DAEMON_UP\"; break\n    fi\n    sleep 1\n  done\n  if [ -z \"$up\" ]; then echo \"$who daemon never came up\" >&2; tail -n 40 \"${who}-daemon.log\" >&2; exit 1; fi\ndone\n", "exit_code": 0, "kind": "run", "note": "", "output": "alice_DAEMON_UP\nbob_DAEMON_UP\ncarol_DAEMON_UP\n", "status": "pass"}], "md": "### 3.2 Wait for the three control planes to come up\n\n```bash\n# poll each daemon's control plane until it answers\nlogoscore --config-dir alice list-modules\nlogoscore --config-dir bob   list-modules\nlogoscore --config-dir carol list-modules\n```"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir alice load-module chat_module\n./logos/bin/logoscore --config-dir bob   load-module chat_module\n./logos/bin/logoscore --config-dir carol load-module chat_module\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[\"delivery_module\"],\"module\":\"chat_module\",\"status\":\"ok\",\"version\":\"0.2.2\"}\n{\"dependencies_loaded\":[\"delivery_module\"],\"module\":\"chat_module\",\"status\":\"ok\",\"version\":\"0.2.2\"}\n{\"dependencies_loaded\":[\"delivery_module\"],\"module\":\"chat_module\",\"status\":\"ok\",\"version\":\"0.2.2\"}\n", "status": "pass"}], "md": "### 3.3 Load chat_module on each (delivery_module auto-resolves)\n\n```bash\nlogoscore --config-dir alice load-module chat_module\nlogoscore --config-dir bob   load-module chat_module\nlogoscore --config-dir carol load-module chat_module\n```"}, {"execs": [], "md": "## Step 4: Bring the three instances online\n\n`init(config)` returns immediately and kicks off the\ndelivery bootstrap asynchronously; readiness arrives later when\n`status().delivery_state` flips to `online`. All three are\ninitialised **first** so their cold Waku bootstraps overlap, then each is\npolled; the wait is ~the slowest of the three, not their sum."}, {"execs": [{"cmd": "for who in alice bob carol; do\n  out=$(./logos/bin/logoscore --config-dir \"$who\" call chat_module init '{\"delivery_preset\":\"logos.test\"}')\n  echo \"$out\"\n  echo \"$out\" | jq -e '.result.success == true' >/dev/null || { echo \"$who init failed: $out\" >&2; exit 1; }\n  echo \"${who}_INIT_OK\"\ndone\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"init\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\nalice_INIT_OK\n{\"method\":\"init\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\nbob_INIT_OK\n{\"method\":\"init\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\ncarol_INIT_OK\n", "status": "pass"}], "md": "### 4.1 Initialise Alice, Bob, and Carol\n\n```bash\nlogoscore --config-dir alice call chat_module init '{\"delivery_preset\":\"logos.test\"}'\nlogoscore --config-dir bob   call chat_module init '{\"delivery_preset\":\"logos.test\"}'\nlogoscore --config-dir carol call chat_module init '{\"delivery_preset\":\"logos.test\"}'\n```\n\n`init` takes a `ChatConfig` record, and every field of it is optional:\n`log_level` is left out here, so the chat core logs at its default. The\nrecord arrives as its JSON text because `logoscore call` coerces an\nargument to a bool, a number or a string, never to an object.\n\nNeither storage nor ports need an argument: each instance uses the\ndirectory its daemon assigned it, and its delivery node listens on\nports it picks itself."}, {"execs": [{"cmd": "for who in alice bob carol; do\n  online=\"\"\n  for i in $(seq 1 60); do\n    out=$(./logos/bin/logoscore --config-dir \"$who\" call chat_module status 2>/dev/null || true)\n    case \"$out\" in\n      *'\"delivery_state\":\"online\"'*) online=1; echo \"${who}_ONLINE\"; break;;\n      *'\"delivery_state\":\"error\"'*) echo \"$who delivery error: $out\" >&2; tail -n 40 \"${who}-daemon.log\" >&2; exit 1;;\n    esac\n    sleep 2\n  done\n  if [ -z \"$online\" ]; then echo \"$who never came online\" >&2; tail -n 40 \"${who}-daemon.log\" >&2; exit 1; fi\ndone\n", "exit_code": 0, "kind": "run", "note": "", "output": "alice_ONLINE\nbob_ONLINE\ncarol_ONLINE\n", "status": "pass"}], "md": "### 4.2 Wait for all three to reach Online\n\n```bash\n# poll status() until delivery_state == online (fail fast on \"error\")\nlogoscore --config-dir alice call chat_module status\nlogoscore --config-dir bob   call chat_module status\nlogoscore --config-dir carol call chat_module status\n```"}, {"execs": [], "md": "## Step 5: Create the group and grow it to three members\n\nAlice creates the group (a one-member conversation) and invites Bob by\nhis address. Once Bob is in, **Bob** \u2014 not the creator \u2014 invites Carol:\nany member can propose an add. Each add is agreed by the group, committed\nby the steward after the commit-inactivity window, and the welcome then\ntravels to the invited instance, so the polls below wait minutes, not\nseconds."}, {"execs": [{"cmd": "for who in alice bob carol; do\n  out=$(./logos/bin/logoscore --config-dir \"$who\" call chat_module get_address)\n  echo \"$out\" | jq -j '.result' > \"${who}-addr.txt\"\n  echo \"${who} address: $(cat ${who}-addr.txt)\"\ndone\n", "exit_code": 0, "kind": "run", "note": "", "output": "alice address: d299bab5c12e96a1907eaf3b031a5e67ca6c78ed5853ac2d9f8858a6e3b4721d\nbob address: 2d665741fb769678e07fbd6d3847c90f91e52c069284b13151bb8b10fb279540\ncarol address: 3300e43482577e699791867c55406dd59f7180db3c425413c79d102d20b23205\n", "status": "pass"}], "md": "### 5.1 Everyone publishes an address\n\n```bash\nlogoscore --config-dir alice call chat_module get_address | jq -j '.result' > alice-addr.txt\nlogoscore --config-dir bob   call chat_module get_address | jq -j '.result' > bob-addr.txt\nlogoscore --config-dir carol call chat_module get_address | jq -j '.result' > carol-addr.txt\n```\n\nThe address is the instance's account address. Peers use it both to\nopen 1:1 conversations and to invite the instance into groups; the\nkey material behind it was published to the registry during `init`."}, {"execs": [{"cmd": "out=$(./logos/bin/logoscore --config-dir alice call chat_module create_group_conversation \"Book Club\" \"Weekly sci-fi picks\")\necho \"$out\"\necho \"$out\" | jq -e '.result.success == true' >/dev/null || { echo \"create_group_conversation failed: $out\" >&2; exit 1; }\necho \"$out\" | jq -j '.result.value' > group-id.txt\necho \"group id: $(cat group-id.txt)\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"create_group_conversation\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":\"a94e69aab1\"},\"status\":\"ok\"}\ngroup id: a94e69aab1\n", "status": "pass"}], "md": "### 5.2 Alice creates the group\n\n```bash\nlogoscore --config-dir alice call chat_module create_group_conversation \"Book Club\" \"Weekly sci-fi picks\"\n```\n\nThe group starts with Alice as its only member; `result.value` is the\nconversation id **every** member will see once they join. The name and\ndescription Alice passed are the group's shared metadata, stored in its\nMLS context and delivered to every joiner in the welcome."}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\nout=$(./logos/bin/logoscore --config-dir alice call chat_module add_group_member \"$gid\" @bob-addr.txt)\necho \"$out\"\necho \"$out\" | jq -e '.result.success == true' >/dev/null || { echo \"add_group_member failed: $out\" >&2; exit 1; }\necho \"BOB_INVITED\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"add_group_member\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\nBOB_INVITED\n", "status": "pass"}], "md": "### 5.3 Alice invites Bob\n\n```bash\nlogoscore --config-dir alice call chat_module add_group_member \"$GROUP_ID\" @bob-addr.txt\n```\n\nThe call returns as soon as the add is proposed; the commit and the\nwelcome happen asynchronously in the group."}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\nfor i in $(seq 1 150); do\n  row=$(./logos/bin/logoscore --config-dir bob call chat_module list_conversations 2>/dev/null | jq -c --arg id \"$gid\" '.result[]? | select(.convo_id == $id)' || true)\n  if [ -n \"$row\" ]; then echo \"BOB_IN_GROUP name=$(echo \"$row\" | jq -r '.name // \"\"')\"; break; fi\n  sleep 4\ndone\n[ -n \"$row\" ] || { echo \"bob never joined the group\" >&2; tail -n 40 bob-daemon.log >&2; exit 1; }\n", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "bob never joined the group\n[2026-08-22 10:00:19.589] [out] [delivery_module] DBG 2026-08-22 10:00:19.587+00:00 received relay message                     topics=\"waku relay\" tid=28428 my_peer_id=16U*WbezdF msg_hash=0x5474351893205e612bd73744ef06a6b55c9ae3b41b092225ca9caa182ec71b49 msg_id=9574b259c75e...7972113c76bd from_peer_id=16U*6eXsqS topic=/waku/2/rs/2/0 contentTopic=/whisperbox/1/all/proto receivedTime=1787392819589084416 payloadSizeBytes=23883.0\n[2026-08-22 10:00:19.589] [out] [delivery_module] INF 2026-08-22 10:00:19.587+00:00 handling message                           topics=\"waku filter\" tid=28428 pubsubTopic=/waku/2/rs/2/0 contentTopic=/whisperbox/1/all/proto msg_hash=0x5474351893205e612bd73744ef06a6b55c9ae3b41b092225ca9caa182ec71b49\n[2026-08-22 10:00:19.589] [out] [delivery_module] INF 2026-08-22 10:00:19.587+00:00 findSubscribedPeers result                 topics=\"waku filter subscriptions\" tid=28428 filter_criterion=\"(pubsubTopic: /waku/2/rs/2/0, con e same three-member set once the adds have committed\neverywhere."}, {"execs": [], "md": "## Step 6: Messages fan out to every member, with senders attributed\n\nOne send reaches every other member. Each receiver's `get_messages`\nattributes the message to the sender's account address (the same string\nthat instance's `get_address` returned), verified against the account \u2192\ndevice directory on delivery."}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\nsent=\"\"\nfor i in $(seq 1 20); do\n  out=$(./logos/bin/logoscore --config-dir alice call chat_module send_message \"$gid\" hello-group 2>/dev/null || true)\n  if echo \"$out\" | jq -e '.result.success == true' >/dev/null 2>&1; then sent=1; echo \"ALICE_SENT\"; break; fi\n  sleep 5\ndone\n[ -n \"$sent\" ] || { echo \"alice could not send: $out\" >&2; exit 1; }\n", "exit_code": 0, "kind": "run", "note": "", "output": "ALICE_SENT\n", "status": "pass"}], "md": "### 6.1 Alice messages the group\n\n```bash\nlogoscore --config-dir alice call chat_module send_message \"$GROUP_ID\" hello-group\n```\n\nThe short retry loop covers the group's brief post-commit windows in\nwhich sends are rejected (the group is finalizing a membership\nchange)."}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\naddr=$(cat alice-addr.txt)\nfor who in bob carol; do\n  got=\"\"\n  for i in $(seq 1 60); do\n    ok=$(./logos/bin/logoscore --config-dir \"$who\" call chat_module get_messages \"$gid\" 2>/dev/null | jq -r --arg a \"$addr\" '.result[]? | select(.content == \"hello-group\") | select(.sender == $a) | .content' || true)\n    if [ -n \"$ok\" ]; then got=1; echo \"$(echo \"$who\" | tr a-z A-Z)_GOT_HELLO_FROM_ALICE\"; break; fi\n    sleep 4\n  done\n  [ -n \"$got\" ] || { echo \"$who never received alice's message\" >&2; tail -n 40 \"${who}-daemon.log\" >&2; exit 1; }\ndone\n", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "bob never received alice's message\n[2026-08-22 10:18:40.824] [out] [delivery_module] INF 2026-08-22 10 iption=\"Timeout exceeded!\" peerId=16Uiu2HAmMryXZ2y7AXVHP9Wqmp5YeNQLKrYx56gtoCE2RkimmUru\n", "status": "fail"}], "md": "### 6.4 Alice and Bob both receive Carol's reply\n\n```bash\nlogoscore --config-dir alice call chat_module get_messages \"$GROUP_ID\"\nlogoscore --config-dir bob   call chat_module get_messages \"$GROUP_ID\"\n```\n\nThe newest member's messages reach the founding members and vice\nversa: all three instances share one MLS group at one epoch, and\nevery message is end-to-end encrypted and sender-attributed."}, {"execs": [], "md": "## Step 7: Stop the daemons"}, {"execs": [{"cmd": "./logos/bin/logoscore --config-dir alice stop || true\n./logos/bin/logoscore --config-dir bob   stop || true\n./logos/bin/logoscore --config-dir carol stop || true\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.1 Shut all three down gracefully\n\n```bash\nlogoscore --config-dir alice stop\nlogoscore --config-dir bob   stop\nlogoscore --config-dir carol stop\n```\n\nAlways stop through the control socket rather than killing the process group: three daemons share one shell here."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>

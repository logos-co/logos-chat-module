[package]
name     = "chat_module"
version  = "0.2.2"
edition  = "2021"

[lib]
crate-type = ["staticlib"]

# Standalone crate. The empty table keeps cargo from adopting a workspace it
# finds in a parent directory. resolver = "3" matches libchat's workspace (its
# members are edition 2024, default resolver 3); aligning here avoids
# feature-unification drift between our build and libchat's standalone build.
[workspace]
resolver = "3"

# Panicking across the FFI boundary is UB; safer-ffi (transitive via libchat)
# requires abort. Cargo honours [profile.release] only on the resolution root,
# so libchat's own panic = "abort" is ignored when libchat is a dependency.
[profile.release]
panic = "abort"

[dependencies]
# libchat's transport-generic threaded client (package `logos-generic-chat`).
# It owns the inbound worker that drives `Core::handle_payload` and surfaces
# observations as `Event`s on a channel the module drains. The module brings its own
# delivery (logoscore's delivery_module), so it depends on this transport-generic
# crate, not the `logos-chat` facade that bundles an embedded logos delivery.
# Every libchat crate is pinned to the same main rev, so their shared types agree.
logos-generic-chat = { git = "https://github.com/logos-messaging/logos-chat.git", package = "logos-generic-chat", rev = "992084edfd0ca5d13591692190b0078b807078a3" }
# The account (package `account`, under the name libchat's own crates give it):
# each launch publishes a fresh one whose log endorses this installation's key.
logos-account  = { git = "https://github.com/logos-messaging/logos-chat.git", package = "account", rev = "992084edfd0ca5d13591692190b0078b807078a3" }
# `HttpAuthClient`, which publishes the account's log and checks other
# participants against theirs, on the registry's server.
components     = { git = "https://github.com/logos-messaging/logos-chat.git", package = "components", rev = "992084edfd0ca5d13591692190b0078b807078a3" }
# The chat history, in `chat.db`.
message-store  = { git = "https://github.com/logos-messaging/logos-chat.git", package = "message-store", rev = "992084edfd0ca5d13591692190b0078b807078a3" }
# The connection `message-store` borrows. SQLCipher, so `chat.db` is keyed:
# without the feature `PRAGMA key` is ignored and the file is written in plain
# text, so enable it on our own dep rather than rely on libchat's.
rusqlite       = { version = "0.35", features = ["bundled-sqlcipher-vendored-openssl"] }
# Versions the module's own tables in `chat.db`, through `PRAGMA user_version`.
rusqlite_migration = "2.1"
# The client hands back a `Receiver<Event>` and drains a `Receiver<Vec<u8>>`
# through its `Transport`, so the module's plumbing speaks the same channel type.
crossbeam-channel = "0.5"
# The runtime SDK, staged by the module builder (codegen.rust) at this path
# from the same logos-rust-sdk rev its generator came from, so the generated
# scaffold and the linked SDK never skew. The path is absent in a standalone
# checkout; build via `nix build .#chat_module`.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
thiserror      = "2"
# This module's own account of a run, raised on the same channel libchat uses so
# one subscriber and one filter cover both.
tracing            = "0.1"
# The process's `tracing` subscriber (see `logging`); `env-filter` reads `RUST_LOG`.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The event and level types the subscriber's line format is written against.
tracing-core       = "0.1"
# Stamps this run's log file name in local time, which is the naming a consumer
# groups a log directory into runs by. Already in the graph, so declaring it
# builds nothing new.
chrono         = { version = "0.4", default-features = false, features = ["clock", "std"] }

# libchat's `crypto` crate is written for the xeddsa 1.0 API. Cargo's
# default SemVer resolution would pick 1.1.0 (released since), whose
# `Sign::sign` signature changed and no longer compiles against the
# `crypto` crate. Pin to 1.0.2 (libchat's own declared version) to keep
# the transitive build working.
xeddsa         = "=1.0.2"

[dev-dependencies]
# A directory the run-log tests can rotate and prune in.
tempfile = "3"

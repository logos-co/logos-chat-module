name: "Headless two-instance message exchange"
output: chat-module-exchange.md
project_name: logos-chat-module
release: ""

intro: |
  This tutorial shows how to use `chat_module` end to end, by example. A
  conversation takes two parties: one shares their address, the other opens a
  conversation with it, the first side joins, and messages flow both ways. That
  round-trip spans **two** independent `chat_module` instances talking over the
  live delivery network.

  So the tutorial runs two headless [`logosctl`](https://github.com/logos-co/logos-logoscore-cli)
  daemons (Alice and Bob), each loading `chat_module` and its runtime dependency
  `delivery_module`, and drives them through the `logosctl call` CLI: `init`,
  `get_address`, `create_conversation`, `send_message`, and reading the thread
  back with `list_conversations` / `get_messages`.

  `logosctl call` is request/response, so it never receives the module's push
  events; instead each side **polls** its own persisted state (`status`,
  `list_conversations`, `get_messages`) for what an event-driven consumer would
  get as `delivery_state_changed` / `conversation_created` / `message_received`.
  The exchange itself (an MLS group keyed from key packages exchanged through a
  registry, end-to-end-encrypted messages over `delivery_module`) is exactly what
  an application drives.

what_you_build: "A verified end-to-end, end-to-end-encrypted message round-trip between two headless chat_module instances, with no UI."

what_you_learn:
  - "Run two isolated `logosctl` daemons on one host, selected by `--config-dir`"
  - "Bring a `chat_module` instance online with `init()` and poll `status()` for `delivery_state == online`"
  - "Drive the full round-trip over the CLI (share an address, open a conversation, reply) and observe receipt by polling `list_conversations` / `get_messages` instead of events"
  - "How the `result`-bearing methods wrap their payload as `{success, value, error}` while the collection/status getters return their value directly"
  - "What a restart keeps: the conversation and its messages, but not the installation that could send into it"

prerequisites:
  - |
    **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:

    ```bash
    mkdir -p ~/.config/nix
    echo 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf
    ```
  - "**A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, cargo, rustc) during the builds."
  - "**`jq`** on `PATH` (used to read the JSON the CLI prints). GitHub runners ship it; locally, run the spec inside `nix shell nixpkgs#jq`."
  - "**Network access.** The two delivery nodes discover each other over the `logos.test` Waku fleet; an isolated sandbox won't complete the exchange. Expect ~5-40s to reach Online and up to ~2 min for messages to propagate."

sections:
  - title: "Build logosctl and the two modules"
    step: true
    text: |
      One tool drives the exchange: `logosctl`, the headless module runtime, which
      also installs packages and bundles `capability_module` under `logos/modules/`.
      Then the two modules the daemons load: `chat_module`, and its runtime
      dependency `delivery_module`.

      `chat_module` is built as `#lgx`, and `delivery_module` as
      `#delivery_module-lgx`, a passthrough this flake re-exports from its own
      delivery input, so the running `delivery_module` is the exact rev
      `chat_module` is built against.
    steps:
      - title: "Build logosctl"
        run: "nix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logos"
        check_file: "logos/bin/logosctl"
      - title: "Build chat_module (the commit under test)"
        run: "nix build \"github:logos-co/logos-chat-module{release}#lgx\" -o chat-lgx"
        code_block: "nix build 'github:logos-co/logos-chat-module#lgx' -o chat-lgx"
        check_file: "chat-lgx"
        post_text: |
          `#lgx` is the installable bundle (`chat_module` staticlib + the Qt-plugin
          glue + `metadata.json`). `{release}` is pinned to this commit in CI via
          `--release-for logos-chat-module=<sha>`.
      - title: "Build delivery_module (chat_module's runtime dependency)"
        run: "nix build \"github:logos-co/logos-chat-module{release}#delivery_module-lgx\" -o delivery-lgx"
        code_block: "nix build 'github:logos-co/logos-chat-module#delivery_module-lgx' -o delivery-lgx"
        check_file: "delivery-lgx"
        post_text: |
          Built from `chat_module`'s own flake, so the running `delivery_module` is
          the exact rev `chat_module` is built against.

  - title: "Start two isolated daemons"
    step: true
    text: |
      One module is a per-host singleton inside a daemon, so Alice and Bob are
      **separate daemons**. The only thing that keeps them apart is `--config-dir`:
      it scopes each daemon's control socket, client token, installed modules, and
      persistence to its own tree, so a `logosctl --config-dir alice call ...`
      always reaches Alice's daemon. That is also what isolates the two
      `chat_module` instances on disk: the daemon assigns each module instance a
      directory under its config dir, and the module stores everything there.
      (Their delivery nodes need no such scoping: each picks its own listening
      ports.)
    steps:
      - title: "Start Alice's daemon"
        text: |
          `--detach` returns once the daemon accepts commands. It logs to
          `alice/logs/daemon.log`.
        # Each daemon gets its own HOME: the bundled package downloader starts a
        # storage node in $HOME/.logos_storage, and two would fight over its lock.
        run: "mkdir -p home-alice && HOME=\"$PWD/home-alice\" ./logos/bin/logosctl --config-dir alice daemon start --detach"
        code_block: "logosctl --config-dir alice daemon start --detach"
        expect_contains:
          - "Daemon started"
      - title: "Start Bob's daemon"
        run: "mkdir -p home-bob && HOME=\"$PWD/home-bob\" ./logos/bin/logosctl --config-dir bob daemon start --detach"
        code_block: "logosctl --config-dir bob daemon start --detach"
        expect_contains:
          - "Daemon started"

  - title: "Install and load the modules"
    step: true
    text: |
      Each daemon installs into its own session, so both `.lgx`s go into Alice's
      and into Bob's.
    steps:
      - title: "Install both modules into each session"
        text: |
          A path ending in `.lgx` installs from disk, with no catalog involved, and
          one command takes both. Local builds are unsigned, which the session's
          default policy accepts with a warning. `-y` confirms, since there is no
          terminal to ask on.
        run: |
          set -e
          for who in alice bob; do
            ./logos/bin/logosctl --config-dir "$who" install delivery-lgx/*.lgx chat-lgx/*.lgx -y
            test -f "$who/modules/delivery_module/manifest.json"
            test -f "$who/modules/chat_module/manifest.json"
          done
        code_block: |
          logosctl --config-dir alice install delivery-lgx/*.lgx chat-lgx/*.lgx -y
          logosctl --config-dir bob   install delivery-lgx/*.lgx chat-lgx/*.lgx -y
        expect_contains:
          - '"status":"ok"'
          - "delivery_module"
          - "chat_module"
      - title: "Load chat_module on each (delivery_module auto-resolves)"
        run: |
          ./logos/bin/logosctl --config-dir alice module load chat_module
          ./logos/bin/logosctl --config-dir bob   module load chat_module
        code_block: |
          logosctl --config-dir alice module load chat_module
          logosctl --config-dir bob   module load chat_module
        expect_contains:
          - "delivery_module"
        post_text: "`chat_module` declares `dependencies: [delivery_module]`, so the host loads delivery_module on each daemon automatically."

  - title: "Bring both instances online"
    step: true
    text: |
      `init(config)` returns immediately and kicks off the
      delivery bootstrap asynchronously; `status().delivery_state` flips to
      `online` when delivery reports its node started. Initial topic subscriptions
      are dispatched asynchronously after that. Both instances are initialised
      **first** so their two cold Waku
      bootstraps overlap, then each is polled; the wait is ~the slower of the two,
      not their sum.
    steps:
      - title: "Initialise Alice and Bob"
        run: |
          ./logos/bin/logosctl --config-dir alice call chat_module init 'json:{"delivery_preset":"logos.test"}'
          ./logos/bin/logosctl --config-dir bob   call chat_module init 'json:{"delivery_preset":"logos.test"}'
        code_block: |
          logosctl --config-dir alice call chat_module init 'json:{"delivery_preset":"logos.test"}'
          logosctl --config-dir bob   call chat_module init 'json:{"delivery_preset":"logos.test"}'
        expect_contains:
          - '"status":"ok"'
        post_text: |
          `init` takes a `ChatConfig` record, and every field of it is optional:
          `log_level` is left out here, so the chat core logs at its default. The
          `json:` prefix makes `logosctl call` send the record as an object;
          without it the record would arrive as a string, which `init` refuses.

          Neither storage nor ports need an argument: each instance uses the
          directory its daemon assigned it, and its delivery node listens on
          ports it picks itself.
      - title: "Wait for both to reach Online"
        run: |
          for who in alice bob; do
            online=""
            for i in $(seq 1 60); do
              out=$(./logos/bin/logosctl --config-dir "$who" call chat_module status 2>/dev/null || true)
              case "$out" in
                *'"delivery_state":"online"'*) online=1; echo "${who}_ONLINE"; break;;
                *'"delivery_state":"error"'*) echo "$who delivery error: $out" >&2; tail -n 40 "$who/logs/daemon.log" >&2; exit 1;;
              esac
              sleep 2
            done
            if [ -z "$online" ]; then echo "$who never came online" >&2; tail -n 40 "$who/logs/daemon.log" >&2; exit 1; fi
          done
          # The bridge forwards initial topic subscriptions after observing Online.
          # Give those asynchronous subscriptions time to reach delivery before
          # Bob sends Alice a one-shot invite.
          sleep 5
        code_block: |
          # poll status() until delivery_state == online (fail fast on "error")
          logosctl --config-dir alice call chat_module status
          logosctl --config-dir bob   call chat_module status
          # wait for the initial delivery topic subscriptions
          sleep 5
        expect_contains:
          - "alice_ONLINE"
          - "bob_ONLINE"
        post_text: |
          `status()` returns the `Status` record directly under `result`
          (`{"status":"ok","result":{"delivery_state":"online",...}}`), unlike the
          `result`-bearing methods below, which nest their payload one level deeper.
          The initial topic subscriptions are asynchronous, so allow a short
          settling interval before sending the first invite.

  - title: "The round-trip"
    step: true
    text: |
      Alice shares her address, Bob opens a DirectV1 conversation with her, Alice
      joins via the invite, then Bob sends the first message and Alice replies — a
      bidirectional round-trip between two independent headless instances.
    steps:
      - title: "Alice publishes her address"
        run: |
          out=$(./logos/bin/logosctl --config-dir alice call chat_module get_address)
          echo "$out"
          echo "$out" | jq -j '.result' > alice-addr.txt
          echo "alice address: $(cat alice-addr.txt)"
        code_block: |
          logosctl --config-dir alice call chat_module get_address | jq -j '.result' > alice-addr.txt
        expect_contains:
          - "alice address:"
        check_file: "alice-addr.txt"
        post_text: |
          `get_address` returns the LIDL `tstr` type, so its payload is the string
          directly at `.result` — Alice's installation address, what a peer needs to
          open a conversation with her. Her key package was published to the registry
          during `init`, so the address alone lets Bob reach her.
      - title: "Bob opens a conversation with Alice"
        run: |
          out=$(./logos/bin/logosctl --config-dir bob call chat_module create_conversation @alice-addr.txt)
          echo "$out"
          echo "$out" | jq -e '.result.success == true' >/dev/null || { echo "create_conversation failed: $out" >&2; exit 1; }
          echo "$out" | jq -j '.result.value' > bob-convo.txt
          echo "bob convo: $(cat bob-convo.txt)"
        code_block: |
          logosctl --config-dir bob call chat_module create_conversation @alice-addr.txt
        expect_contains:
          - '"status":"ok"'
          - "bob convo:"
        post_text: |
          `@alice-addr.txt` feeds Alice's address as the argument. Bob fetches her
          key package from the registry and sends her an MLS invite; `result.value`
          is Bob's conversation id. The first message is sent separately, once Alice
          has joined.
      - title: "Alice joins the conversation"
        run: |
          for i in $(seq 1 50); do
            cid=$(./logos/bin/logosctl --config-dir alice call chat_module list_conversations 2>/dev/null | jq -r --arg id "$(cat bob-convo.txt)" '.result[]? | select(.convo_id == $id) | .convo_id' || true)
            if [ -n "$cid" ]; then echo "$cid" > alice-convo.txt; echo "ALICE_HAS_CONVO $cid"; break; fi
            sleep 3
          done
          [ -s alice-convo.txt ] || { echo "alice never joined the conversation" >&2; exit 1; }
        code_block: |
          # poll until Alice has processed the invite and joined
          logosctl --config-dir alice call chat_module list_conversations | jq -r --arg id "$BOB_CONVO" '.result[] | select(.convo_id == $id) | .convo_id'
        expect_contains:
          - "ALICE_HAS_CONVO"
        post_text: |
          DirectV1 is group-based, so both sides share one conversation id (the
          group id) — unlike PrivateV1's asymmetric ids. So Alice looks for Bob's
          id among her conversations, which may also hold ones kept from earlier
          runs. Once it appears, Alice has joined and subscribed to its delivery
          address, so she is ready to receive messages on it.
      - title: "Bob sends the first message"
        run: |
          cid=$(cat bob-convo.txt)
          ./logos/bin/logosctl --config-dir bob call chat_module send_message "$cid" hello-from-bob
        code_block: |
          logosctl --config-dir bob call chat_module send_message "$BOB_CONVO" hello-from-bob
        expect_contains:
          - '"status":"ok"'
        post_text: |
          Bob sends only after Alice has joined (previous step), so the message
          reaches her subscribed thread rather than racing ahead of her join.
      - title: "Alice receives Bob's message"
        run: |
          cid=$(cat alice-convo.txt)
          for i in $(seq 1 50); do
            msgs=$(./logos/bin/logosctl --config-dir alice call chat_module get_messages "$cid" 2>/dev/null || true)
            case "$msgs" in *'"content":"hello-from-bob"'*) echo "ALICE_GOT_BOB_MSG"; exit 0;; esac
            sleep 3
          done
          echo "alice never received bob's message" >&2; exit 1
        code_block: |
          logosctl --config-dir alice call chat_module get_messages "$ALICE_CONVO"
        expect_contains:
          - "ALICE_GOT_BOB_MSG"
        post_text: |
          DirectV1 gives both sides the **same** conversation id (the MLS group id).
          Received messages are persisted and surface via `get_messages` with no
          event subscription; `list_conversations` / `get_messages` return their
          arrays directly under `result`.
      - title: "Alice replies"
        run: |
          cid=$(cat alice-convo.txt)
          ./logos/bin/logosctl --config-dir alice call chat_module send_message "$cid" hi-bob-got-it
        code_block: |
          logosctl --config-dir alice call chat_module send_message "$ALICE_CONVO" hi-bob-got-it
        expect_contains:
          - '"status":"ok"'
      - title: "Bob receives Alice's reply"
        run: |
          cid=$(cat bob-convo.txt)
          for i in $(seq 1 50); do
            msgs=$(./logos/bin/logosctl --config-dir bob call chat_module get_messages "$cid" 2>/dev/null || true)
            case "$msgs" in *'"content":"hi-bob-got-it"'*) echo "BOB_GOT_REPLY"; exit 0;; esac
            sleep 3
          done
          echo "bob never received alice's reply" >&2; exit 1
        code_block: |
          logosctl --config-dir bob call chat_module get_messages "$BOB_CONVO"
        expect_contains:
          - "BOB_GOT_REPLY"
        post_text: |
          The same path in reverse: a real bidirectional, end-to-end-encrypted
          round-trip between two independent headless `chat_module` instances.

  - title: "Alice restarts"
    step: true
    text: |
      `chat_module` keeps its conversations and their messages in its instance
      directory, which a daemon started again on the same `--config-dir` assigns
      it again. The chat core's state does not survive: each `init` is a new
      installation, so the conversation reads back but can no longer be sent
      into.
    steps:
      - title: "Stop Alice's daemon"
        text: "`daemon stop` returns once the daemon has exited."
        run: |
          ./logos/bin/logosctl --config-dir alice daemon stop
          ./logos/bin/logosctl --config-dir alice daemon status || true
        code_block: |
          logosctl --config-dir alice daemon stop
        expect_contains:
          - '"status":"not_running"'
      - title: "Start it again on the same config dir"
        text: "The session still holds both installed modules, so nothing is reinstalled."
        run: "HOME=\"$PWD/home-alice\" ./logos/bin/logosctl --config-dir alice daemon start --detach"
        code_block: "logosctl --config-dir alice daemon start --detach"
        expect_contains:
          - "Daemon started"
      - title: "Load and initialise chat_module"
        run: |
          ./logos/bin/logosctl --config-dir alice module load chat_module
          ./logos/bin/logosctl --config-dir alice call chat_module init 'json:{"delivery_preset":"logos.test"}'
        code_block: |
          logosctl --config-dir alice module load chat_module
          logosctl --config-dir alice call chat_module init 'json:{"delivery_preset":"logos.test"}'
        expect_contains:
          - '"status":"ok"'
      - title: "The conversation and its messages are back"
        run: |
          cid=$(cat alice-convo.txt)
          ./logos/bin/logosctl --config-dir alice call chat_module list_conversations \
            | jq -e --arg id "$cid" '[.result[] | select(.convo_id == $id) | .history_only] == [true]' >/dev/null \
            || { echo "alice lost the conversation, or it is not marked history_only" >&2; exit 1; }
          msgs=$(./logos/bin/logosctl --config-dir alice call chat_module get_messages "$cid")
          echo "$msgs"
          echo "$msgs" | jq -e '[.result[] | [.content, .from_self]] == [["hello-from-bob", false], ["hi-bob-got-it", true]]' >/dev/null \
            || { echo "alice's messages did not read back in order" >&2; exit 1; }
          echo "ALICE_KEPT_HISTORY"
        code_block: |
          logosctl --config-dir alice call chat_module list_conversations
          logosctl --config-dir alice call chat_module get_messages "$ALICE_CONVO"
        expect_contains:
          - "ALICE_KEPT_HISTORY"
        post_text: |
          Nothing is polled here: `init` reads the conversation list and each
          conversation's newest messages back before it returns, with no network.
          The conversation comes back with `history_only` set.
      - title: "Sending into it fails"
        run: |
          cid=$(cat alice-convo.txt)
          out=$(./logos/bin/logosctl --config-dir alice call chat_module send_message "$cid" after-restart || true)
          echo "$out"
          case "$out" in
            *'previous session'*) echo "ALICE_SEND_REFUSED";;
            *) echo "send into a previous session's conversation did not fail as expected" >&2; exit 1;;
          esac
        code_block: |
          logosctl --config-dir alice call chat_module send_message "$ALICE_CONVO" after-restart
        expect_contains:
          - "ALICE_SEND_REFUSED"
        post_text: |
          The restarted Alice is a new installation that is not a member of the
          conversation, so `send_message` fails and says why. The conversation
          stays readable, and can still be labelled or deleted.

  - title: "Stop the daemons"
    step: true
    steps:
      - title: "Shut both down gracefully"
        run: |
          ./logos/bin/logosctl --config-dir alice daemon stop || true
          ./logos/bin/logosctl --config-dir bob   daemon stop || true
        code_block: |
          logosctl --config-dir alice daemon stop
          logosctl --config-dir bob   daemon stop
        post_text: "Always stop through the control socket rather than killing processes: `daemon stop` unloads the daemon's modules and returns once it has exited."

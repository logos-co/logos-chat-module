name: "Load chat_module on Windows"
output: chat-module-windows.md
project_name: logos-chat-module
release: ""

intro: |
  This doc-test checks the Windows build of `chat_module` with its matching
  `delivery_module` dependency. CI stages both modules into a native
  `logosctl` session, starts the daemon, loads `chat_module`, inspects its API,
  and calls `status()`.

  The test uses no network. The Linux doc-tests separately exercise live
  one-to-one and group message exchanges.

what_you_build: "A Windows chat_module plugin loaded and called through a native logosctl daemon."

what_you_learn:
  - How to stage chat_module with its delivery_module dependency
  - How to load chat_module and inspect its methods through logosctl
  - How to call status() before bringing a delivery node online

sections:
  - title: "Load and call chat_module on Windows"
    platform: windows
    step: true
    text: |
      The shared Windows CI stages the cross-built modules and `logosctl`.
      These commands run on a native Windows runner from that staged directory.
    steps:
      - title: "Stage chat and delivery modules"
        text: |
          The session's `modules/` directory is where a daemon finds installed
          modules; `capability_module` stays in the bundled set beside the binary.
        run: |
          test -f windows-logosctl/modules/capability_module/manifest.json
          mkdir -p windows-chat-smoke-config/modules
          cp -R delivery_module-install-portable/modules/delivery_module windows-chat-smoke-config/modules/
          cp -R install-portable/modules/chat_module windows-chat-smoke-config/modules/
        check_file: windows-chat-smoke-config/modules/chat_module/manifest.json

      - title: "Start the Windows daemon"
        text: "`--detach` returns once the daemon accepts commands."
        run: "run windows-logosctl/bin/logosctl.exe --config-dir ./windows-chat-smoke-config daemon start --detach"
        expect_contains:
          - "Daemon started"

      - title: "Load chat and its delivery dependency"
        run: "run windows-logosctl/bin/logosctl.exe --config-dir ./windows-chat-smoke-config module load chat_module"
        expect_contains:
          - '"module":"chat_module"'
          - '"delivery_module"'

      - title: "Inspect the chat API"
        run: "run windows-logosctl/bin/logosctl.exe --config-dir ./windows-chat-smoke-config module show chat_module"
        expect_contains:
          - '"name":"status"'

      - title: "Call chat status"
        run: "run windows-logosctl/bin/logosctl.exe --config-dir ./windows-chat-smoke-config call chat_module status"
        expect_contains:
          - '"delivery_state":"stopped"'

      - title: "Stop the Windows daemon"
        run: "run windows-logosctl/bin/logosctl.exe --config-dir ./windows-chat-smoke-config daemon stop"
        expect_contains:
          - '"status":"ok"'

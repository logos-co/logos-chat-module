<script id="report-data" type="application/json">{"generated_platform": "Linux", "summary": {"failed": 1, "passed": 51, "skipped": 0}, "tutorials": [{"meta": {"name": "Headless two-instance message exchange", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Headless two-instance message exchange\n\nThis tutorial shows how to use `chat_module` end to end, by example. A\nconversation takes two parties: one shares their address, the other opens a\nconversation with it, the first side joins, and messages flow both ways. That\nround-trip spans **two** independent `chat_module` instances talking over the\nlive delivery network.\n\nSo the tutorial runs two headless [`logosctl`](https://github.com/logos-co/logos-logoscore-cli)\ndaemons (Alice and Bob), each loading `chat_module` and its runtime dependency\n`delivery_module`, and drives them through the `logosctl call` CLI: `init`,\n`get_address`, `set_display_name` / `get_display_name`, `create_conversation`,\n`send_message`, and reading the thread back with `list_conversations` /\n`get_messages`.\n\n`logosctl call` is request/response, so it never receives the module's push\nevents; instead each side **polls** its own persisted state (`status`,\n`list_conversations`, `get_messages`) for what an event-driven consumer would\nget as `delivery_state_changed` / `conversation_created` / `message_received`.\nThe exchange itself (an MLS group keyed from key packages exchanged through a\nregistry, end-to-end-encrypted messages over `delivery_module`) is exactly what\nan application drives.\n\n**What you'll build:** A verified end-to-end, end-to-end-encrypted message round-trip between two headless chat_module instances, with no UI.\n\n**What you'll learn:**\n\n- Run two isolated `logosctl` daemons on one host, selected by `--config-dir`\n- Bring a `chat_module` instance online with `init()` and poll `status()` for `delivery_state == online`\n- Drive the full round-trip over the CLI (share an address, open a conversation, reply) and observe receipt by polling `list_conversations` / `get_messages` instead of events\n- How the `result`-bearing methods wrap their payload as `{success, value, error}` while the collection/status getters return their value directly\n- Name an account with `set_display_name`, and read a peer's name with `get_display_name`\n- What a restart keeps: the account, with its address and name, and the conversation and its messages, but not the installation that could send into it\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, cargo, rustc) during the builds.\n- **`jq`** on `PATH` (used to read the JSON the CLI prints). GitHub runners ship it; locally, run the spec inside `nix shell nixpkgs#jq`.\n- **Network access.** The two delivery nodes discover each other over the `logos.dev` Waku fleet, which needs no RLN membership to send; an isolated sandbox won't complete the exchange. Expect ~5-40s to reach Online and up to ~2 min for messages to propagate."}, {"execs": [], "md": "## Step 1: Build logosctl and the two modules\n\nOne tool drives the exchange: `logosctl`, the headless module runtime, which\nalso installs packages and bundles `capability_module` under `logos/modules/`.\nThen the two modules the daemons load: `chat_module`, and its runtime\ndependency `delivery_module`.\n\n`chat_module` is built as `#lgx`, and `delivery_module` as\n`#delivery_module-lgx`, a passthrough this flake re-exports from its own\ndelivery input, so the running `delivery_module` is the exact rev\n`chat_module` is built against."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logos", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md "action\":\"install\",\"file\":\"/home/runner/work/_temp/doctest-test-297bn4e2/chat-lgx/logos-chat_module-module-lib.lgx\",\"fromVersion\":\"\",\"name\":\"chat_module\",\"signature\":\"unsigned\",\"toVersion\":\"0.4.0\"}],\"installed\":[\"delivery_module\",\"chat_module\"],\"op\":\"install\",\"reloaded\":[],\"status\":\"ok\",\"stopped_dependents\":[]}\n{\"affected_loaded\":[],\"changes\":[{\"action\":\"install\",\"file\":\"/home/runner/work/_temp/doctest-test-297bn4e2/delivery-lgx/logos-delivery_module-module-lib.lgx\",\"fromVersion\":\"\",\"name\":\"delivery_module\",\"signature\":\"unsigned\",\"toVersion\":\"0.4.0\"},{\"action\":\"install\",\"file\":\"/home/runner/work/_temp/doctest-test-297bn4e2/chat-lgx/logos-chat_module-module-lib.lgx\",\"fromVersion\":\"\",\"name\":\"chat_module\",\"signature\":\"unsigned\",\"toVersion\":\"0.4.0\"}],\"installed\":[\"delivery_module\",\"chat_module\"],\"op\":\"install\",\"reloaded\":[],\"status\":\"ok\",\"stopped_dependents\":[]}\n", "status": "pass"}], "md": "### 3.1 Install both modules into each session\n\nA path ending in `.lgx` installs from disk, with no catalog involved, and\none command takes both. Local builds are unsigned, which the session's\ndefault policy accepts with a warning. `-y` confirms, since there is no\nterminal to ask on.\n\n```bash\nlogosctl --config-dir alice install delivery-lgx/*.lgx chat-lgx/*.lgx -y\nlogosctl --config-dir bob   install delivery-lgx/*.lgx chat-lgx/*.lgx -y\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir alice module load chat_module\n./logos/bin/logosctl --config-dir bob   module load chat_module\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[\"delivery_module\"],\"module\":\"chat_module\",\"optional_skipped\":[{\"module\":\"libp2p_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"},{\"module\":\"liblogos_rln_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"}],\"status\":\"ok\",\"version\":\"0 cord, and every field of it is optional:\n`log_level` is left out here, so the chat core logs at its default. The\n`json:` prefix makes `logosctl call` send the record as an object;\nwithout it the record would arrive as a string, which `init` refuses.\n\nNeither storage nor ports need an argument: each instance uses the\ndirectory its daemon assigned it, and its delivery node listens on\nports it picks itself."}, {"execs": [{"cmd": "for who in alice bob; do\n  online=\"\"\n  for i in $(seq 1 60); do\n    out=$(./logos/bin/logosctl --config-dir \"$who\" call chat_module status 2>/dev/null || true)\n    case \"$out\" in\n      *'\"delivery_state\":\"online\"'*) online=1; echo \"${who}_ONLINE\"; break;;\n      *'\"delivery_state\":\"error\"'*) echo \"$who delivery error: $out\" >&2; tail -n 40 \"$who/logs/daemon.log\" >&2; exit 1;;\n    esac\n    sleep 2\n  done\n  if [ -z \"$online\" ]; then echo \"$who never came online\" >&2; tail -n 40 \"$who/logs/daemon.log\" >&2; exit 1; fi\ndone\n# The bridge forwards initial topic subscriptions after observing Online.\n# Give those asynchronous subscriptions time to reach delivery before\n# Bob sends Alice a one-shot invite.\nsleep 5\n", "exit_code": 0, "kind": "run", "note": "", "output": "alice_ONLINE\nbob_ONLINE\n", "status": "pass"}], "md": "### 4.2 Wait for both to reach Online\n\n```bash\n# poll status() until delivery_state == online (fail fast on \"error\")\nlogosctl --config-dir alice call chat_module status\nlogosctl --config-dir bob   call chat_module status\n# wait for the initial delivery topic subscriptions\nsleep 5\n```\n\n`status()` returns the `Status` record directly under `result`\n(`{\"status\":\"ok\",\"result\":{\"delivery_state\":\"online\",...}}`), unlike the\n`result`-bearing methods below, which nest their payload one level deeper.\nThe initial topic subscriptions are asynchronous, so allow a short\nsettling interval before sending the first invite."}, {"execs": [], "md": "## Step 5: The round-trip\n\nAlice shares her address, Bob opens a DirectV1 conversation with her, Alice\njoins via the invite, then Bob sends the first message and Alice replies \u2014 a\nbidirectional round-trip between two independent headless instances."}, {"execs": [{"cmd": "out=$(./logos/bin/logosctl --config-dir alice call chat_module get_address)\necho \"$out\"\necho \"$out\" | jq -j '.result' > alice-addr.txt\necho \"alice address: $(cat alice-addr.txt)\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"get_address\",\"module\":\"chat_module\",\"result\":\"bc85d7435f4006bb9d2d8987ccba2359fcc02ffe39c989ae61c89ba8fc50d4e7\",\"status\":\"ok\"}\nalice address: bc85d7435f4006bb9d2d8987ccba2359fcc02ffe39c989ae61c89ba8fc50d4e7\n", "status": "pass"}], "md": "### 5.1 Alice publishes her address\n\n```bash\nlogosctl --config-dir alice call chat_module get_address | jq -j '.result' > alice-addr.txt\n```\n\n`get_address` returns the LIDL `tstr` type, so its payload is the string\ndirectly at `.result`: Alice's account address, what a peer needs to open\na conversation with her. Her installation's key package was published to\nthe registry during `init`, so the address alone lets Bob reach her."}, {"execs": [{"cmd": "out=$(./logos/bin/logosctl --config-dir alice call chat_module set_display_name Alice)\necho \"$out\"\necho \"$out\" | jq -e '.result.success == true' >/dev/null || { echo \"set_display_name failed: $out\" >&2; exit 1; }\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"set_display_name\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.2 Alice names her account\n\n```bash\nlogosctl --config-dir alice call chat_module set_display_name Alice\n```\n\nThe name goes into her account's log on the registry, next to the\ninstallation `init` endorsed, so anyone with her address can read it."}, {"execs": [{"cmd": "for i in $(seq 1 20); do\n  name=$(./logos/bin/logosctl --config-dir bob call chat_module get_display_name @alice-addr.txt 2>/dev/null | jq -j '.result' || true)\n  if [ \"$name\" = \"Alice\" ]; then echo \"BOB_SEES_ALICE\"; exit 0; fi\n  sleep 3\ndone\necho \"bob never read alice's name\" >&2\nexit 1\n", "exit_code": 0, "kind": "run", "note": "", "output": "BOB_SEES_ALICE\n", "status": "pass"}], "md": "### 5.3 Bob reads her name\n\n```bash\nlogosctl --config-dir bob call chat_module get_display_name @alice-addr.txt\n```\n\n`get_display_name` answers at once from what Bob holds, which is nothing\nthe first time: that ask reads Alice's log in the background, and the\nnext one answers `Alice`. An event-driven consumer gets the name as\n`display_name_changed` instead of asking again."}, {"execs": [{"cmd": "out=$(./logos/bin/logosctl --config-dir bob call chat_module create_conversation @alice-addr.txt)\necho \"$out\"\necho \"$out\" | jq -e '.result.success == true' >/dev/null || { echo \"create_conversation failed: $out\" >&2; exit 1; }\necho \"$out\" | jq -j '.result.value' > bob-convo.txt\necho \"bob convo: $(cat bob-convo.txt)\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"create_conversation\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":\"c43b84335e8c0df7e77d0ba8a16982f5\"},\"status\":\"ok\"}\nbob convo: c43b84335e8c0df7e77d0ba8a16982f5\n", "status": "pass"}], "md": "### 5.4 Bob opens a conversation with Alice\n\n```bash\nlogosctl --config-dir bob call chat_module create_conversation @alice-addr.txt\n```\n\n`@alice-addr.txt` feeds Alice's address as the argument. Bob fetches her\nkey package from the registry and sends her an MLS invite; `result.value`\nis Bob's conversation id. The first message is sent separately, once Alice\nhas joined."}, {"execs": [{"cmd": "for i in $(seq 1 50); do\n  cid=$(./logos/bin/logosctl --config-dir alice call chat_module list_conversations 2>/dev/null | jq -r --arg id \"$(cat bob-convo.txt)\" '.result[]? | select(.convo_id == $id) | .convo_id' || true)\n  if [ -n \"$cid\" ]; then echo \"$cid\" > alice-convo.txt; echo \"ALICE_HAS_CONVO $cid\"; break; fi\n  sleep 3\ndone\n[ -s alice-convo.txt ] || { echo \"alice never joined the conversation\" >&2; exit 1; }\n", "exit_code": 0, "kind": "run", "note": "", "output": "ALICE_HAS_CONVO c43b84335e8c0df7e77d0ba8a16982f5\n", "status": "pass"}], "md": "### 5.5 Alice joins the conversation\n\n```bash\n# poll until Alice has processed the invite and joined\nlogosctl --config-dir alice call chat_module list_conversations | jq -r --arg id \"$BOB_CONVO\" '.result[] | select(.convo_id == $id) | .convo_id'\n```\n\nDirectV1 is group-based, so both sides share one conversation id (the\ngroup id) \u2014 unlike PrivateV1's asymmetric ids. So Alice looks for Bob's\nid among her conversations, which may also hold ones kept from earlier\nruns. Once it appears, Alice has joined and subscribed to its delivery\naddress, so she is ready to receive messages on it."}, {"execs": [{"cmd": "cid=$(cat bob-convo.txt)\n./logos/bin/logosctl --config-dir bob call chat_module send_message \"$cid\" hello-from-bob\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"send_message\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.6 Bob sends the first message\n\n```bash\nlogosctl --config-dir bob call chat_module send_message \"$BOB_CONVO\" hello-from-bob\n```\n\nBob sends only after Alice has joined (previous step), so the message\nreaches her subscribed thread rather than racing ahead of her join."}, {"execs": [{"cmd": "cid=$(cat alice-convo.txt)\nfor i in $(seq 1 50); do\n  msgs=$(./logos/bin/logosctl --config-dir alice call chat_module get_messages \"$cid\" 2>/dev/null || true)\n  case \"$msgs\" in *'\"content\":\"hello-from-bob\"'*) echo \"ALICE_GOT_BOB_MSG\"; exit 0;; esac\n  sleep 3\ndone\necho \"alice never received bob's message\" >&2\nfor who in alice bob; do\n  echo \"--- $who: chat_module's run log\" >&2\n  find \"$who\" -name 'chat_module_*.log' -exec cat {} + >&2\n  echo \"--- $who: daemon.log, last 40 lines\" >&2\n  tail -n 40 \"$who/logs/daemon.log\" >&2\ndone\nexit 1\n", "exit_code": 0, "kind": "run", "note": "", "output": "ALICE_GOT_BOB_MSG\n", "status": "pass"}], "md": "### 5.7 Alice receives Bob's message\n\n```bash\nlogosctl --config-dir alice call chat_module get_messages \"$ALICE_CONVO\"\n```\n\nDirectV1 gives both sides the **same** conversation id (the MLS group id).\nReceived messages are persisted and surface via `get_messages` with no\nevent subscription; `list_conversations` / `get_messages` return their\narrays directly under `result`."}, {"execs": [{"cmd": "cid=$(cat alice-convo.txt)\n./logos/bin/logosctl --config-dir alice call chat_module send_message \"$cid\" hi-bob-got-it\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"send_message\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.8 Alice replies\n\n```bash\nlogosctl --config-dir alice call chat_module send_message \"$ALICE_CONVO\" hi-bob-got-it\n```"}, {"execs": [{"cmd": "cid=$(cat bob-convo.txt)\nfor i in $(seq 1 50); do\n  msgs=$(./logos/bin/logosctl --config-dir bob call chat_module get_messages \"$cid\" 2>/dev/null || true)\n  case \"$msgs\" in *'\"content\":\"hi-bob-got-it\"'*) echo \"BOB_GOT_REPLY\"; exit 0;; esac\n  sleep 3\ndone\necho \"bob never received alice's reply\" >&2\nfor who in alice bob; do\n  echo \"--- $who: chat_module's run log\" >&2\n  find \"$who\" -name 'chat_module_*.log' -exec cat {} + >&2\n  echo \"--- $who: daemon.log, last 40 lines\" >&2\n  tail -n 40 \"$who/logs/daemon.log\" >&2\ndone\nexit 1\n", "exit_code": 0, "kind": "run", "note": "", "output": "BOB_GOT_REPLY\n", "status": "pass"}], "md": "### 5.9 Bob receives Alice's reply\n\n```bash\nlogosctl --config-dir bob call chat_module get_messages \"$BOB_CONVO\"\n```\n\nThe same path in reverse: a real bidirectional, end-to-end-encrypted\nround-trip between two independent headless `chat_module` instances."}, {"execs": [], "md": "## Step 6: Alice restarts\n\n`chat_module` keeps its account, its conversations and their messages in\nits instance directory, which a daemon started again on the same\n`--config-dir` assigns it again. The chat core's state does not survive:\neach `init` is a new installation of the same account, so the conversation\nreads back but can no longer be sent into, while a conversation Bob opens\nwith the same address reaches the new installation."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir alice daemon stop\n./logos/bin/logosctl --config-dir alice daemon status || true\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n{\"daemon\":{\"reason\":\"No daemon running (no local endpoint at /home/runner/work/_temp/logos_core_service_fade6bd6ce39). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"not_running\"}}\n", "status": "pass"}], "md": "### 6.1 Stop Alice's daemon\n\n`daemon stop` returns once the daemon has exited.\n\n```bash\nlogosctl --config-dir alice daemon stop\n```"}, {"execs": [{"cmd": "HOME=\"$PWD/home-alice\" ./logos/bin/logosctl --config-dir alice daemon start --detach", "exit_code": 0, "kind": "run", "note": "", "output": "Daemon started (pid 5116)\nLogs: /home/runner/work/_temp/doctest-test-297bn4e2/alice/logs/daemon.log\n", "status": "pass"}], "md": "### 6.2 Start it again on the same config dir\n\nThe session still holds both installed modules, so nothing is reinstalled.\n\n```bash\nlogosctl --config-dir alice daemon start --detach\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir alice module load chat_module\n./logos/bin/logosctl --config-dir alice call chat_module init 'json:{\"delivery_preset\":\"logos.dev\"}'\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[\"delivery_module\"],\"module\":\"chat_module\",\"optional_skipped\":[{\"module\":\"libp2p_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"},{\"module\":\"liblogos_rln_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"}],\"status\":\"ok\",\"version\":\"0.4.0\"}\n{\"method\":\"init\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 6.3 Load and initialise chat_module\n\n```bash\nlogosctl --config-dir alice module load chat_module\nlogosctl --config-dir alice call chat_module init 'json:{\"delivery_preset\":\"logos.dev\"}'\n```"}, {"execs": [{"cmd": "cid=$(cat alice-convo.txt)\n./logos/bin/logosctl --config-dir alice call chat_module list_conversations \\\n  | jq -e --arg id \"$cid\" '[.result[] | select(.convo_id == $id) | .history_only] == [true]' >/dev/null \\\n  || { echo \"alice lost the conversation, or it is not marked history_only\" >&2; exit 1; }\nmsgs=$(./logos/bin/logosctl --config-dir alice call chat_module get_messages \"$cid\")\necho \"$msgs\"\necho \"$msgs\" | jq -e '[.result[] | [.content, .from_self]] == [[\"hello-from-bob\", false], [\"hi-bob-got-it\", true]]' >/dev/null \\\n  || { echo \"alice's messages did not read back in order\" >&2; exit 1; }\necho \"ALICE_KEPT_HISTORY\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"get_messages\",\"module\":\"chat_module\",\"result\":[{\"content\":\"hello-from-bob\",\"delivered\":false,\"from_self\":false,\"sender\":\"79665e6d156b1a8bfd7aabcd956266f4bcbc3b8c62176f8bfaf0fa1bcaf3aff6\",\"timestamp_ms\":1795566091413},{\"content\":\"hi-bob-got-it\",\"delivered\":false,\"from_self\":true,\"message_id\":\"81aef21adfa6f51d83010f43cb2583cab5f84047115af1f9698943f9ac17cc0b\",\"timestamp_ms\":1795566094297}],\"status\":\"ok\"}\nALICE_KEPT_HISTORY\n", "status": "pass"}], "md": "### 6.4 The conversation and its messages are back\n\n```bash\nlogosctl --config-dir alice call chat_module list_conversations\nlogosctl --config-dir alice call chat_module get_messages \"$ALICE_CONVO\"\n```\n\nNothing is polled here: `init` reads the conversation list and each\nconversation's newest messages back before it returns, with no network.\nThe conversation comes back with `history_only` set."}, {"execs": [{"cmd": "addr=$(./logos/bin/logosctl --config-dir alice call chat_module get_address | jq -j '.result')\n[ \"$addr\" = \"$(cat alice-addr.txt)\" ] || { echo \"alice's address changed: $addr\" >&2; exit 1; }\nname=$(./logos/bin/logosctl --config-dir alice call chat_module get_display_name @alice-addr.txt | jq -j '.result')\n[ \"$name\" = \"Alice\" ] || { echo \"alice's name did not read back: $name\" >&2; exit 1; }\necho \"ALICE_KEPT_ACCOUNT\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "ALICE_KEPT_ACCOUNT\n", "status": "pass"}], "md": "### 6.5 Her address and name are the same\n\n```bash\nlogosctl --config-dir alice call chat_module get_address\nlogosctl --config-dir alice call chat_module get_display_name @alice-addr.txt\n```\n\n`init` ran as the account the first start made, and read its name from\nthe account's log, so both answer at once."}, {"execs": [{"cmd": "cid=$(cat alice-convo.txt)\nout=$(./logos/bin/logosctl --config-dir alice call chat_module send_message \"$cid\" after-restart || true)\necho \"$out\"\ncase \"$out\" in\n  *'previous session'*) echo \"ALICE_SEND_REFUSED\";;\n  *) echo \"send into a previous session's conversation did not fail as expected\" >&2; exit 1;;\nesac\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"send_message\",\"module\":\"chat_module\",\"result\":{\"error\":\"conversation is from a previous session and kept for its history only\",\"success\":false,\"value\":null},\"status\":\"ok\"}\nALICE_SEND_REFUSED\n", "status": "pass"}], "md": "### 6.6 Sending into it fails\n\n```bash\nlogosctl --config-dir alice call chat_module send_message \"$ALICE_CONVO\" after-restart\n```\n\nThe restarted Alice is a new installation that is not a member of the\nconversation, so `send_message` fails and says why. The conversation\nstays readable, and can still be labelled or deleted."}, {"execs": [{"cmd": "online=\"\"\nfor i in $(seq 1 60); do\n  out=$(./logos/bin/logosctl --config-dir alice call chat_module status 2>/dev/null || true)\n  case \"$out\" in\n    *'\"delivery_state\":\"online\"'*) online=1; echo \"ALICE_ONLINE_AGAIN\"; break;;\n    *'\"delivery_state\":\"error\"'*) echo \"alice delivery error: $out\" >&2; tail -n 40 alice/logs/daemon.log >&2; exit 1;;\n  esac\n  sleep 2\ndone\nif [ -z \"$online\" ]; then echo \"alice never came online again\" >&2; tail -n 40 alice/logs/daemon.log >&2; exit 1; fi\n# As before the first invite: her inbox subscription follows Online.\nsleep 5\n", "exit_code": 0, "kind": "run", "note": "", "output": "ALICE_ONLINE_AGAIN\n", "status": "pass"}], "md": "### 6.7 Wait for her to reach Online again\n\n```bash\nlogosctl --config-dir alice call chat_module status\nsleep 5\n```\n\nBob's invite is one message to her new installation's inbox, which she\nhears only once her node has subscribed to it."}, {"execs": [{"cmd": "out=$(./logos/bin/logosctl --config-dir bob call chat_module create_conversation @alice-addr.txt)\necho \"$out\"\necho \"$out\" | jq -e '.result.success == true' >/dev/null || { echo \"create_conversation failed: $out\" >&2; exit 1; }\necho \"$out\" | jq -j '.result.value' > bob-convo-2.txt\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"create_conversation\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":\"13b4e1a9b82cf060b2bf52b327fe306f\"},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 6.8 Bob opens a new conversation with her\n\n```bash\nlogosctl --config-dir bob call chat_module create_conversation @alice-addr.txt\n```\n\nThe same address as before. Alice's `init` revoked her earlier\ninstallation in her account's log and endorsed the new one, so Bob's\ninvite goes to the installation that is running."}, {"execs": [{"cmd": "cid=$(cat bob-convo-2.txt)\njoined=\nfor i in $(seq 1 50); do\n  if ./logos/bin/logosctl --config-dir alice call chat_module list_conversations 2>/dev/null \\\n    | jq -e --arg id \"$cid\" '[.result[]? | select(.convo_id == $id) | .history_only] == [false]' >/dev/null; then\n    joined=1; break\n  fi\n  sleep 3\ndone\nif [ -z \"$joined\" ]; then\n  echo \"the restarted alice never joined bob's new conversation\" >&2\n  find alice -name 'chat_module_*.log' -exec cat {} + >&2\n  exit 1\nfi\n./logos/bin/logosctl --config-dir bob call chat_module send_message \"$cid\" hello-again\nfor i in $(seq 1 50); do\n  msgs=$(./logos/bin/logosctl --config-dir alice call chat_module get_messages \"$cid\" 2>/dev/null || true)\n  case \"$msgs\" in *'\"content\":\"hello-again\"'*) echo \"ALICE_GOT_NEW_CONVO\"; exit 0;; esac\n  sleep 3\ndone\necho \"the restarted alice never received bob's message\" >&2\nfor who in alice bob; do\n  echo \"--- $who: chat_module's run log\" >&2\n  find \"$who\" -name 'chat_module_*.log' -exec cat {} + >&2\ndone\nexit 1\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"send_message\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\nALICE_GOT_NEW_CONVO\n", "status": "pass"}], "md": "### 6.9 The restarted Alice joins and hears from Bob\n\n```bash\nlogosctl --config-dir alice call chat_module list_conversations\nlogosctl --config-dir bob   call chat_module send_message \"$BOB_CONVO_2\" hello-again\nlogosctl --config-dir alice call chat_module get_messages \"$BOB_CONVO_2\"\n```\n\nBob sends once Alice has joined, as in the first round-trip. The new\nconversation is live on both sides, next to the old one kept as\nhistory."}, {"execs": [], "md": "## Step 7: Stop the daemons"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir alice daemon stop || true\n./logos/bin/logosctl --config-dir bob   daemon stop || true\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.1 Shut both down gracefully\n\n```bash\nlogosctl --config-dir alice daemon stop\nlogosctl --config-dir bob   daemon stop\n```\n\nAlways stop through the control socket rather than killing processes: `daemon stop` unloads the daemon's modules and returns once it has exited."}]}, {"meta": {"name": "Headless three-instance group conversation", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Headless three-instance group conversation\n\nThis tutorial shows `chat_module`'s group API end to end, by example. A\ngroup conversation starts with its creator as the only member and grows\none peer at a time: the creator (or any existing member) invites a peer by\naddress, and the invited instance joins once the welcome reaches it. Every\nmember sees the **same** conversation id, and each received message carries\nthe sender's account address.\n\nSo the tutorial runs three headless [`logosctl`](https://github.com/logos-co/logos-logoscore-cli)\ndaemons (Alice, Bob, and Carol), each loading `chat_module` and its runtime\ndependency `delivery_module`, and drives them through the `logosctl call`\nCLI: `init`, `get_address`, `create_group_conversation`, `add_group_member`,\n`send_message`, and reading the shared thread back with\n`list_conversations` / `get_messages`.\n\nGroup membership changes are **asynchronous by design**: the inviting\ninstance publishes the add as an MLS commit at once, but every member, the\ninviter included, applies a commit only two minutes after it first holds\none, so that members holding competing commits settle on the same one. The\ninviter sends the welcome when it applies its commit, so expect a join to\nland a little over two minutes after the `add_group_member` call over the\nlive network. The poll loops below are budgeted for that.\n\n**What you'll build:** A verified three-member, end-to-end-encrypted group conversation across three headless chat_module instances, grown member by member, with sender-attributed message fan-out.\n\n**What you'll learn:**\n\n- Run three isolated `logosctl` daemons on one host, selected by `--config-dir`\n- Create a named group with `create_group_conversation` and grow it with `add_group_member` \u2014 including an add proposed by a non-creator member\n- Why a group join lands asynchronously (commit, a two-minute wait to apply it, then the welcome), and how to observe it by polling `list_conversations`\n- How every member shares one conversation id, and how `get_messages` attributes each inbound message to its sender's account address\n- How each conversation names the protocol it runs\n- How a sender learns that another member received its message\n- How members confirm they hold one group state, by the epoch and fingerprint in `get_debug_data`\n- How each member tells every other member's `sync` against its own\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\n- **A Linux or macOS machine.** Nix provides every toolchain (Qt, CMake, cargo, rustc) during the builds.\n- **`jq`** on `PATH` (used to read the JSON the CLI prints). GitHub runners ship it; locally, run the spec inside `nix shell nixpkgs#jq`.\n- **Network access.** The three delivery nodes discover each other over the `logos.dev` Waku fleet, which needs no RLN membership to send; an isolated sandbox won't complete the exchange. Expect ~5-40s to reach Online, minutes per membership change, and up to ~2 min for messages to propagate."}, {"execs": [], "md": "## Step 1: Build logosctl and the two modules\n\nOne tool drives the exchange: `logosctl`, the headless module runtime,\nwhich also installs packages and bundles `capability_module` under\n`logos/modules/`. Then the two modules the daemons load: `chat_module`,\nand its runtime dependency `delivery_module`."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logos", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.1 Build logosctl\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logos\n```"}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-chat-module/3f70aa96c2910068442b21e1a295754de07e1a94#lgx\" -o chat-lgx", "exit_code": 0, "kind": "run", "note": "", "output": "warning: ignoring untrusted flake configuration setting 'extra-substituters'.\nPass '--accept-flake-config' to trust it\nwarning: ignoring untrusted flake configuration setting 'extra-trusted-public-keys'.\nPass '--accept-flake-config' to trust it\n", "status": "pass"}], "md": "### 1.2 Build chat_module (the commit under test)\n\n```bash\nnix build 'github:logos-co/logos-chat-module#lgx' -o chat-lgx\n```"}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-chat-module/3f70aa96c2910068442b21e1a295754de07e1a94#delivery_module-lgx\" -o delivery-lgx", "exit_code": 0, "kind": "run", "note": "", "output": "warning: ignoring untrusted flake configuration setting 'extra-substituters'.\nPass '--accept-flake-config' to trust it\nwarning: ignoring untrusted flake configuration setting 'extra-trusted-public-keys'.\nPass '--accept-flake-config' to trust it\n", "status": "pass"}], "md": "### 1.3 Build delivery_module (chat_module's runtime dependency)\n\n```bash\nnix build 'github:logos-co/logos-chat-module#delivery_module-lgx' -o delivery-lgx\n```\n\nBuilt from `chat_module`'s own flake, so the running `delivery_module`\nis the exact rev `chat_module` is built against."}, {"execs": [], "md": "## Step 2: Start three isolated daemons\n\nOne module is a per-host singleton inside a daemon, so Alice, Bob, and\nCarol are **separate daemons**, kept apart by `--config-dir` (control\nsocket, client token, installed modules, persistence, and the\nper-instance directory each daemon assigns its `chat_module`). Their\ndelivery nodes need no such scoping: each picks its own listening ports."}, {"execs": [{"cmd": "set -e\nmkdir -p home-alice home-bob home-carol\nHOME=\"$PWD/home-alice\" ./logos/bin/logosctl --config-dir alice daemon start --detach\nHOME=\"$PWD/home-bob\"   ./logos/bin/logosctl --config-dir bob   daemon start --detach\nHOME=\"$PWD/home-carol\" ./logos/bin/logosctl --config-dir carol daemon start --detach\n", "exit_code": 0, "kind": "run", "note": "", "output": "Daemon started (pid 5292)\nLogs: /home/runner/work/_temp/doctest-test-mydk13i2/alice/logs/daemon.log\nDaemon started (pid 5308)\nLogs: /home/runner/work/_temp/doctest-test-mydk13i2/bob/logs/daemon.log\nDaemon started (pid 5323)\nLogs: /home/runner/work/_temp/doctest-test-mydk13i2/carol/logs/daemon.log\n", "status": "pass"}], "md": "### 2.1 Start the three daemons\n\n`--detach` returns once the daemon accepts commands. Each logs to its\nown `logs/daemon.log`, e.g. `alice/logs/daemon.log`.\n\n```bash\nlogosctl --config-dir alice daemon start --detach\nlogosctl --config-dir bob   daemon start --detach\nlogosctl --config-dir carol daemon start --detach\n```"}, {"execs": [], "md": "## Step 3: Install and load the modules\n\nEach daemon installs into its own session, so both `.lgx`s go into each\nof the three."}, {"execs": [{"cmd": "set -e\nfor who in alice bob carol; do\n  ./logos/bin/logosctl --config-dir \"$who\" install delivery-lgx/*.lgx chat-lgx/*.lgx -y\n  test -f \"$who/modules/delivery_module/manifest.json\"\n  test -f \"$who/modules/chat_module/manifest.json\"\ndone\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"affected_loaded\":[],\"changes\":[{\"action\":\"install\",\"file\":\"/home/runner/work/_temp/doctest-test-mydk13i2/delivery-lgx/logos-delivery_module-module-lib.lgx\",\"fromVersion\":\"\",\"name\":\"delivery_module\",\"signature\":\"unsigned\",\"toVersion\":\"0.4.0\"},{\"action\":\"install\",\"file\":\"/home/runner/work/_temp/doctest-test-mydk13i2/chat-lgx/logos-chat_module-module-lib.lgx\",\"fromVersion\":\"\",\"name\":\"chat_module\",\"signature\":\"unsigned\",\"toVersion\":\"0.4.0\"}],\"installed\":[\"delivery_module\",\"chat_module\"],\"op\":\"install\",\"reloaded\":[],\"status\":\"ok\",\"stopped_dependents\":[]}\n{\"affected_loaded\":[],\"changes\":[{\"action\":\"install\",\"file\":\"/home/runner/work/_temp/doctest-test-mydk13i2/delivery-lgx/logos-delivery_module-module-lib.lgx\",\"fromVersion\":\"\",\"name\":\"delivery_module\",\"signature\":\"unsigned\",\"toVersion\":\"0.4.0\"},{\"action\":\"install\",\"file\":\"/home/runner/work/_temp/doctest-test-mydk13i2/chat-lgx/logos-chat_module-module-lib.lgx\",\"fromVersion\":\"\",\"name\":\"chat_module\",\"signature\":\"unsigned\",\"toVersion\":\"0.4.0\"}],\"installed\":[\"delivery_module\",\"chat_module\"],\"op\":\"install\",\"reloaded\":[],\"status\":\"ok\",\"stopped_dependents\":[]}\n{\"affected_loaded\":[],\"changes\":[{\"action\":\"install\",\"file\":\"/home/runner/work/_temp/doctest-test-mydk13i2/delivery-lgx/logos-delivery_module-module-lib.lgx\",\"fromVersion\":\"\",\"name\":\"delivery_module\",\"signature\":\"unsigned\",\"toVersion\":\"0.4.0\"},{\"action\":\"install\",\"file\":\"/home/runner/work/_temp/doctest-test-mydk13i2/chat-lgx/logos-chat_module-module-lib.lgx\",\"fromVersion\":\"\",\"name\":\"chat_module\",\"signature\":\"unsigned\",\"toVersion\":\"0.4.0\"}],\"installed\":[\"delivery_module\",\"chat_module\"],\"op\":\"install\",\"reloaded\":[],\"status\":\"ok\",\"stopped_dependents\":[]}\n", "status": "pass"}], "md": "### 3.1 Install both modules into each session\n\nA path ending in `.lgx` installs from disk, with no catalog involved, and\none command takes both. Local builds are unsigned, which the session's\ndefault policy accepts with a warning. `-y` confirms, since there is no\nterminal to ask on.\n\n```bash\nlogosctl --config-dir alice install delivery-lgx/*.lgx chat-lgx/*.lgx -y\nlogosctl --config-dir bob   install delivery-lgx/*.lgx chat-lgx/*.lgx -y\nlogosctl --config-dir carol install delivery-lgx/*.lgx chat-lgx/*.lgx -y\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir alice module load chat_module\n./logos/bin/logosctl --config-dir bob   module load chat_module\n./logos/bin/logosctl --config-dir carol module load chat_module\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[\"delivery_module\"],\"module\":\"chat_module\",\"optional_skipped\":[{\"module\":\"libp2p_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"},{\"module\":\"liblogos_rln_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"}],\"status\":\"ok\",\"version\":\"0.4.0\"}\n{\"dependencies_loaded\":[\"delivery_module\"],\"module\":\"chat_module\",\"optional_skipped\":[{\"module\":\"libp2p_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"},{\"module\":\"liblogos_rln_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"}],\"status\":\"ok\",\"version\":\"0.4.0\"}\n{\"dependencies_loaded\":[\"delivery_module\"],\"module\":\"chat_module\",\"optional_skipped\":[{\"module\":\"libp2p_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"},{\"module\":\"liblogos_rln_module\",\"named_by\":\"delivery_module\",\"reason\":\"not_installed\"}],\"status\":\"ok\",\"version\":\"0.4.0\"}\n", "status": "pass"}], "md": "### 3.2 Load chat_module on each (delivery_module auto-resolves)\n\n```bash\nlogosctl --config-dir alice module load chat_module\nlogosctl --config-dir bob   module load chat_module\nlogosctl --config-dir carol module load chat_module\n```"}, {"execs": [], "md": "## Step 4: Bring the three instances online\n\n`init(config)` returns immediately and kicks off the\ndelivery bootstrap asynchronously; readiness arrives later when\n`status().delivery_state` flips to `online`. All three are\ninitialised **first** so their cold Waku bootstraps overlap, then each is\npolled; the wait is ~the slowest of the three, not their sum."}, {"execs": [{"cmd": "for who in alice bob carol; do\n  out=$(./logos/bin/logosctl --config-dir \"$who\" call chat_module init 'json:{\"delivery_preset\":\"logos.dev\"}')\n  echo \"$out\"\n  echo \"$out\" | jq -e '.result.success == true' >/dev/null || { echo \"$who init failed: $out\" >&2; exit 1; }\n  echo \"${who}_INIT_OK\"\ndone\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"init\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\nalice_INIT_OK\n{\"method\":\"init\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\nbob_INIT_OK\n{\"method\":\"init\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\ncarol_INIT_OK\n", "status": "pass"}], "md": "### 4.1 Initialise Alice, Bob, and Carol\n\n```bash\nlogosctl --config-dir alice call chat_module init 'json:{\"delivery_preset\":\"logos.dev\"}'\nlogosctl --config-dir bob   call chat_module init 'json:{\"delivery_preset\":\"logos.dev\"}'\nlogosctl --config-dir carol call chat_module init 'json:{\"delivery_preset\":\"logos.dev\"}'\n```\n\n`init` takes a `ChatConfig` record, and every field of it is optional:\n`log_level` is left out here, so the chat core logs at its default. The\n`json:` prefix makes `logosctl call` send the record as an object;\nwithout it the record would arrive as a string, which `init` refuses.\n\nNeither storage nor ports need an argument: each instance uses the\ndirectory its daemon assigned it, and its delivery node listens on\nports it picks itself."}, {"execs": [{"cmd": "for who in alice bob carol; do\n  online=\"\"\n  for i in $(seq 1 60); do\n    out=$(./logos/bin/logosctl --config-dir \"$who\" call chat_module status 2>/dev/null || true)\n    case \"$out\" in\n      *'\"delivery_state\":\"online\"'*) online=1; echo \"${who}_ONLINE\"; break;;\n      *'\"delivery_state\":\"error\"'*) echo \"$who delivery error: $out\" >&2; tail -n 40 \"$who/logs/daemon.log\" >&2; exit 1;;\n    esac\n    sleep 2\n  done\n  if [ -z \"$online\" ]; then echo \"$who never came online\" >&2; tail -n 40 \"$who/logs/daemon.log\" >&2; exit 1; fi\ndone\n", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "alice_ONLINE\nbob never came online\n[2026-11-25 00:23:36.940] [info] Inter-module access enforcement is OFF (no access policy set): any loaded module may call any other\n[2026-11-25 00:23:36.942] [info] [logos] Granting host services to 'capability_module': token_registry,token_delivery\n[2026-11-25 00:23:36.958] [out] [capability_module] [2026-11-25 00:23:36.957] [info] Granting host services to capability_module: [\"token_registry\",\"token_delivery\"]\n[2026-11-25 00:23:36.958] [info] [logos] Module loaded: capability_module\n[2026-11-25 00:23:36.973] [info] [logos] Module loaded: modules_state\n[2026-11-25 00:23:36.991] [info] [logos] Module loaded: package_manager\n[2026-11-25 00:23:36.994] [info] [logos] Pushed module snapshot to modules_state\n[2026-11-25 00:23:37.009] [info] [logos] [storage_module] StorageModuleImpl: Initializing...\n[2026-11-25 00:23:37.009] [info] [logos] Module loaded: storage_module\n[2026-11-25 00:23:37.025] [info] [logos] Module loaded: package_downloader\n[2026-11-25 00:23:37.029] [warning] [logos] [capability_module] Warning: QObject::connect: No such signal ::eventResponse(QString,QVariantList)\nLogosctl daemon started (pid 5308, instance f6feb586f806)\nDaemon state: /home/runner/work/_temp/doctest-test-mydk13i2/bob/daemon/state.json\nLocal client config: /home/runner/work/_temp/doctest-test-mydk13i2/bob/client/config.yaml\n[2026-11-25 00:23:37.030] [warning] [logos] [capability_module] Warning: QObject::connect: No such signal ::eventResponse(QString,QVariantList)\n[2026-11-25 00:23:44.281] [warning] [logos] [package_manager] Warning: Package is unsigned: /home/runner/work/_temp/doctest-test-mydk13i2/delivery-lgx/logos-delivery_module-module-lib.lgx\n[2026-11-25 00:23:45.292] [warning] [logos] [package_manager] Warning: Package is unsigned: /home/runner/work/_temp/doctest-test-mydk13i2/chat-lgx/logos-chat_module-module-lib.lgx\n[2026-11-25 00:23:50.034] [info] [logos] Optional dependency 'libp2p_module' of 'delivery_module' is not installed; loading without it\n[2026-11-25 00:23:50.034] [info] [logos] Optional dependency 'liblogos_rln_module' of 'delivery_module' is not installed; loading without it\n[2026-11-25 00:23:50.050] [info] [logos] [delivery_module] DeliveryModuleImpl: Initializing...\n[2026-11-25 00:23:50.050] [info] [logos] Module loaded: delivery_module\n[2026-11-25 00:23:50.074] [info] [logos] Module loaded: chat_module\n[2026-11-25 00:23:51.680] [info] [logos] [chat_module] chat_module: logging logos_generic_chat=info,chat_module=info,libchat=info,warn to stderr and /home/runner/work/_temp/doctest-test-mydk13i2/bob/data/chat_module/977c4001c8e0/chat_module_20261125_002351.log\n[2026-11-25 00:23:53.151] [info] [logos] [chat_module] INFO: chat_module: init: state installed, joining delivery preset logos.dev\n[2026-11-25 00:23:53.153] [warning] [logos] [capability_module] Warning: QObject::connect: No such signal ::eventResponse(QString,QVariantList)\n[2026-11-25 00:23:53.154] [info] [logos] [delivery_module] DeliveryModuleImpl::createNode called\n[2026-11-25 00:23:53.160] [info] [logos] [delivery_module] DeliveryModuleImpl: Waiting for createNode callback...\n[2026-11-25 00:23:53.161] [out] [delivery_module] NTC 2026-11-25 00:23:53.160+00:00 No node key provided, generated a new one; identity will not persist across restarts topics=\"waku conf builder\" tid=5394\n[2026-11-25 00:23:53.161] [out] [delivery_module] INF 2026-11-25 00:23:53.160+00:00 Sharding configuration:                    topics=\"waku conf builder\" tid=5394 shardingConf=\"(kind: AutoSharding, shards: @[0, 1, 2, 3, 4, 5, 6, 7])\" subscribeShards=\"@[0, 1, 2, 3, 4, 5, 6, 7]\"\n[2026-11-25 00:23:53.162] [out] [delivery_module] WRN 2026-11-25 00:23:53.161+00:00 configuration flag ignored                 topics=\"waku cli args\" tid=5394 detail=\"--websocket-port is ignored: --websocket-support is not enabled\"\n[2026-11-25 00:23:53.164] [info] [logos] [delivery_module] DeliveryModuleImpl::createNode callback called with ret: 0\n[2026-11-25 00:23:53.164] [info] [logos] [delivery_module] DeliveryModuleImpl: Delivery context created successfully\n[2026-11-25 00:23:53.165] [info] [logos] [delivery_module] DeliveryModuleImpl::start called\n[2026-11-25 00:24:02.970] [info] [logos] [chat_module] INFO: chat_module::actions: delivery is online\n[2026-11-25 00:24:02.970] [info] [logos] [delivery_module] DeliveryModuleImpl::subscribe called with contentTopic: /logos-chat/1/235623be/proto\n[2026-11-25 00:24:02.971] [info] [logos] [delivery_module] DeliveryModuleImpl: Subscribe completed for topic: /logos-chat/1/235623be/proto with success\n[2026-11-25 00:24:03.271] [info] [logos] [chat_module] INFO: chat_module::actions: delivery is offline\n[2026-11-25 00:25:05.192] [info] [logos] [chat_module] INFO: chat_module::actions: delivery is online\n[2026-11-25 00:25:05.293] [info] [logos] [chat_module] INFO: chat_module::actions: delivery is offline\n", "status": "fail"}], "md": "### 4.2 Wait for all three to reach Online\n\n```bash\n# poll status() until delivery_state == online (fail fast on \"error\")\nlogosctl --config-dir alice call chat_module status\nlogosctl --config-dir bob   call chat_module status\nlogosctl --config-dir carol call chat_module status\n```"}, {"execs": [], "md": "## Step 5: Create the group and grow it to three members\n\nAlice creates the group (a one-member conversation) and invites Bob by\nhis address. Once Bob is in, **Bob** \u2014 not the creator \u2014 invites Carol:\nany member can add one. The inviting instance applies its commit two\nminutes after the add and only then sends the welcome to the invited\ninstance, so the polls below wait minutes, not seconds."}, {"execs": [{"cmd": "for who in alice bob carol; do\n  out=$(./logos/bin/logosctl --config-dir \"$who\" call chat_module get_address)\n  echo \"$out\" | jq -j '.result' > \"${who}-addr.txt\"\n  echo \"${who} address: $(cat ${who}-addr.txt)\"\ndone\n", "exit_code": 0, "kind": "run", "note": "", "output": "alice address: e876897aba86695d13378f02470db870e5fa53669df77abb64f2c95a104ddbee\nbob address: c9a265e8db169afe236e78192a5ce743a07a0f8884b659caa47bb170ea4fd314\ncarol address: 11e59ee35cf81ad6f6d806d3bf1ce91bbe897cbce7c6c57790b6c8ba5ba7e3c2\n", "status": "pass"}], "md": "### 5.1 Everyone publishes an address\n\n```bash\nlogosctl --config-dir alice call chat_module get_address | jq -j '.result' > alice-addr.txt\nlogosctl --config-dir bob   call chat_module get_address | jq -j '.result' > bob-addr.txt\nlogosctl --config-dir carol call chat_module get_address | jq -j '.result' > carol-addr.txt\n```\n\nThe address is the instance's account address. Peers use it both to\nopen 1:1 conversations and to invite the instance into groups; the\nkey material behind it was published to the registry during `init`."}, {"execs": [{"cmd": "out=$(./logos/bin/logosctl --config-dir alice call chat_module create_group_conversation \"Book Club\" \"Weekly sci-fi picks\")\necho \"$out\"\necho \"$out\" | jq -e '.result.success == true' >/dev/null || { echo \"create_group_conversation failed: $out\" >&2; exit 1; }\necho \"$out\" | jq -j '.result.value' > group-id.txt\necho \"group id: $(cat group-id.txt)\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"create_group_conversation\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":\"b08bdff5b4775b7bd339f2e8a3026048\"},\"status\":\"ok\"}\ngroup id: b08bdff5b4775b7bd339f2e8a3026048\n", "status": "pass"}], "md": "### 5.2 Alice creates the group\n\n```bash\nlogosctl --config-dir alice call chat_module create_group_conversation \"Book Club\" \"Weekly sci-fi picks\"\n```\n\nThe group starts with Alice as its only member; `result.value` is the\nconversation id **every** member will see once they join. The name and\ndescription Alice passed are the group's shared metadata, stored in its\nMLS context and delivered to every joiner in the welcome."}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\nout=$(./logos/bin/logosctl --config-dir alice call chat_module add_group_member \"$gid\" @bob-addr.txt)\necho \"$out\"\necho \"$out\" | jq -e '.result.success == true' >/dev/null || { echo \"add_group_member failed: $out\" >&2; exit 1; }\necho \"BOB_INVITED\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"add_group_member\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\nBOB_INVITED\n", "status": "pass"}], "md": "### 5.3 Alice invites Bob\n\n```bash\nlogosctl --config-dir alice call chat_module add_group_member \"$GROUP_ID\" @bob-addr.txt\n```\n\nThe call returns as soon as Alice's instance has published the add's\ncommit; the welcome follows when it applies the commit, two minutes\nlater."}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\nfor i in $(seq 1 150); do\n  row=$(./logos/bin/logosctl --config-dir bob call chat_module list_conversations 2>/dev/null | jq -c --arg id \"$gid\" '.result[]? | select(.convo_id == $id)' || true)\n  if [ -n \"$row\" ]; then echo \"BOB_IN_GROUP name=$(echo \"$row\" | jq -r '.name // \"\"')\"; break; fi\n  sleep 4\ndone\n[ -n \"$row\" ] || { echo \"bob never joined the group\" >&2; tail -n 40 bob/logs/daemon.log >&2; exit 1; }\n", "exit_code": 0, "kind": "run", "note": "", "output": "BOB_IN_GROUP name=Book Club\n", "status": "pass"}], "md": "### 5.4 Bob joins and sees the shared name\n\n```bash\n# poll until the group appears in Bob's conversations, carrying its name\nlogosctl --config-dir bob call chat_module list_conversations\n```\n\nBob's instance observes the group under the **same** conversation id\nAlice created, and its shared name reached him in the welcome: no local\nargument set it. One id and one name per group, shared by all members."}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\nout=$(./logos/bin/logosctl --config-dir bob call chat_module add_group_member \"$gid\" @carol-addr.txt)\necho \"$out\"\necho \"$out\" | jq -e '.result.success == true' >/dev/null || { echo \"add_group_member failed: $out\" >&2; exit 1; }\necho \"CAROL_INVITED\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"add_group_member\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\nCAROL_INVITED\n", "status": "pass"}], "md": "### 5.5 Bob invites Carol (a non-creator add)\n\n```bash\nlogosctl --config-dir bob call chat_module add_group_member \"$GROUP_ID\" @carol-addr.txt\n```\n\nGroup membership is symmetric: any member can add another, and the\ninstance that made the add sends the newcomer the welcome."}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\nfor i in $(seq 1 150); do\n  got=$(./logos/bin/logosctl --config-dir carol call chat_module list_conversations 2>/dev/null | jq -r --arg id \"$gid\" '.result[]? | select(.convo_id == $id) | .convo_id' || true)\n  if [ -n \"$got\" ]; then echo \"CAROL_IN_GROUP $got\"; break; fi\n  sleep 4\ndone\n[ -n \"$got\" ] || { echo \"carol never joined the group\" >&2; tail -n 40 carol/logs/daemon.log >&2; exit 1; }\n", "exit_code": 0, "kind": "run", "note": "", "output": "CAROL_IN_GROUP b08bdff5b4775b7bd339f2e8a3026048\n", "status": "pass"}], "md": "### 5.6 Carol joins\n\n```bash\n# poll until the group id appears in Carol's conversations\nlogosctl --config-dir carol call chat_module list_conversations\n```"}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\na=$(cat alice-addr.txt); b=$(cat bob-addr.txt); c=$(cat carol-addr.txt)\nfor who in alice bob carol; do\n  ok=\"\"\n  for i in $(seq 1 60); do\n    roster=$(./logos/bin/logosctl --config-dir \"$who\" call chat_module list_group_members \"$gid\" 2>/dev/null | jq -r '.result[]? | select(.pending | not) | .address' || true)\n    if printf '%s\\n' \"$roster\" | grep -qF \"$a\" && printf '%s\\n' \"$roster\" | grep -qF \"$b\" && printf '%s\\n' \"$roster\" | grep -qF \"$c\"; then\n      ok=1; echo \"$(echo \"$who\" | tr a-z A-Z)_ROSTER_COMPLETE\"; break\n    fi\n    sleep 4\n  done\n  [ -n \"$ok\" ] || { echo \"$who roster never converged: $roster\" >&2; exit 1; }\ndone\n", "exit_code": 0, "kind": "run", "note": "", "output": "ALICE_ROSTER_COMPLETE\nBOB_ROSTER_COMPLETE\nCAROL_ROSTER_COMPLETE\n", "status": "pass"}], "md": "### 5.7 Every member sees the full three-member roster\n\n```bash\n# each member's roster lists all three account addresses\nlogosctl --config-dir alice call chat_module list_group_members \"$GROUP_ID\"\nlogosctl --config-dir bob   call chat_module list_group_members \"$GROUP_ID\"\nlogosctl --config-dir carol call chat_module list_group_members \"$GROUP_ID\"\n```\n\n`list_group_members` reports the group's roster from libchat's MLS\nstate, each member as its account address. An invite the instance\nhas sent but not applied yet is listed too, flagged `pending`, so\nthis poll skips those. Alice applies Bob's add of Carol two minutes\nafter his commit reaches her, so all three converge on the same\nthree-member set shortly after Carol joins."}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\nviews=$(for who in alice bob carol; do\n  ./logos/bin/logosctl --config-dir \"$who\" call chat_module list_conversations 2>/dev/null \\\n    | jq -r --arg id \"$gid\" '.result[]? | select(.convo_id == $id) | .protocol' || true\ndone)\n[ \"$(printf '%s\\n' \"$views\" | grep -c '^GroupV3$')\" = 3 ] \\\n  || { echo \"not every member names the group GroupV3: $views\" >&2; exit 1; }\necho \"PROTOCOL GroupV3\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "PROTOCOL GroupV3\n", "status": "pass"}], "md": "### 5.8 Every member names the group's protocol\n\n```bash\n# each member's record of the group names its protocol\nlogosctl --config-dir alice call chat_module list_conversations\n```\n\nA group's `protocol` is `GroupV3`, and a direct conversation's is\n`DirectV1`. The module keeps it in chat.db, so a conversation from\nan earlier session still names it."}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\nok=\"\"\nfor i in $(seq 1 60); do\n  views=$(for who in alice bob carol; do\n    ./logos/bin/logosctl --config-dir \"$who\" call chat_module get_debug_data \"$gid\" 2>/dev/null \\\n      | jq -r '.result.value | select(. != null) | \"epoch=\\(.epoch) fingerprint=\\(.epoch_fingerprint) members=\\(.members | length)\"' || true\n  done)\n  if [ \"$(printf '%s\\n' \"$views\" | grep -c '^epoch=[0-9][0-9]* fingerprint=[0-9a-f][0-9a-f]* members=3$')\" = 3 ] \\\n    && [ \"$(printf '%s\\n' \"$views\" | sort -u | wc -l)\" = 1 ]; then\n    ok=1; echo \"SAME_GROUP_STATE $(printf '%s\\n' \"$views\" | head -n 1)\"; break\n  fi\n  sleep 4\ndone\n[ -n \"$ok\" ] || { echo \"the members never agreed on one group state: $views\" >&2; exit 1; }\n", "exit_code": 0, "kind": "run", "note": "", "output": "SAME_GROUP_STATE epoch=2 fingerprint=81f18e2306c210 members=3\n", "status": "pass"}], "md": "### 5.9 Every member holds the same group state\n\n```bash\n# each member reports the group's epoch, its fingerprint and the members\nlogosctl --config-dir alice call chat_module get_debug_data \"$GROUP_ID\"\nlogosctl --config-dir bob   call chat_module get_debug_data \"$GROUP_ID\"\nlogosctl --config-dir carol call chat_module get_debug_data \"$GROUP_ID\"\n```\n\n`get_debug_data` reports what the group says about itself for\ndebugging. Its `epoch` advances with every commit a member applies,\nand `epoch_fingerprint` names the group state at that epoch. Members\nthat applied the same commits hold the same pair; two members at one\nepoch with different fingerprints have forked."}, {"execs": [], "md": "## Step 6: Messages fan out to every member, with senders attributed\n\nOne send reaches every other member. Each receiver's `get_messages`\nattributes the message to the sender's account address (the same string\nthat instance's `get_address` returned), verified against the account \u2192\ndevice directory on delivery. The sends wait for the rosters above: a\nmessage sent by a member that has not applied an add yet is lost to the\nmembers that have, and the other way round."}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\nout=$(./logos/bin/logosctl --config-dir alice call chat_module send_message \"$gid\" hello-group)\necho \"$out\"\necho \"$out\" | jq -e '.result.success == true' >/dev/null || { echo \"alice could not send: $out\" >&2; exit 1; }\necho \"ALICE_SENT\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"send_message\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\nALICE_SENT\n", "status": "pass"}], "md": "### 6.1 Alice messages the group\n\n```bash\nlogosctl --config-dir alice call chat_module send_message \"$GROUP_ID\" hello-group\n```"}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\naddr=$(cat alice-addr.txt)\nfor who in bob carol; do\n  got=\"\"\n  for i in $(seq 1 60); do\n    ok=$(./logos/bin/logosctl --config-dir \"$who\" call chat_module get_messages \"$gid\" 2>/dev/null | jq -r --arg a \"$addr\" '.result[]? | select(.content == \"hello-group\") | select(.sender == $a) | .content' || true)\n    if [ -n \"$ok\" ]; then got=1; echo \"$(echo \"$who\" | tr a-z A-Z)_GOT_HELLO_FROM_ALICE\"; break; fi\n    sleep 4\n  done\n  [ -n \"$got\" ] || { echo \"$who never received alice's message\" >&2; tail -n 40 \"$who/logs/daemon.log\" >&2; exit 1; }\ndone\n", "exit_code": 0, "kind": "run", "note": "", "output": "BOB_GOT_HELLO_FROM_ALICE\nCAROL_GOT_HELLO_FROM_ALICE\n", "status": "pass"}], "md": "### 6.2 Bob and Carol both receive it, attributed to Alice\n\n```bash\n# each member sees the message with sender == Alice's address\nlogosctl --config-dir bob   call chat_module get_messages \"$GROUP_ID\"\nlogosctl --config-dir carol call chat_module get_messages \"$GROUP_ID\"\n```"}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\nout=$(./logos/bin/logosctl --config-dir carol call chat_module send_message \"$gid\" carol-checking-in)\necho \"$out\"\necho \"$out\" | jq -e '.result.success == true' >/dev/null || { echo \"carol could not send: $out\" >&2; exit 1; }\necho \"CAROL_SENT\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"send_message\",\"module\":\"chat_module\",\"result\":{\"error\":null,\"success\":true,\"value\":null},\"status\":\"ok\"}\nCAROL_SENT\n", "status": "pass"}], "md": "### 6.3 Carol replies to the group\n\n```bash\nlogosctl --config-dir carol call chat_module send_message \"$GROUP_ID\" carol-checking-in\n```"}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\naddr=$(cat carol-addr.txt)\nfor who in alice bob; do\n  got=\"\"\n  for i in $(seq 1 60); do\n    ok=$(./logos/bin/logosctl --config-dir \"$who\" call chat_module get_messages \"$gid\" 2>/dev/null | jq -r --arg a \"$addr\" '.result[]? | select(.content == \"carol-checking-in\") | select(.sender == $a) | .content' || true)\n    if [ -n \"$ok\" ]; then got=1; echo \"$(echo \"$who\" | tr a-z A-Z)_GOT_CAROL_REPLY\"; break; fi\n    sleep 4\n  done\n  [ -n \"$got\" ] || { echo \"$who never received carol's reply\" >&2; tail -n 40 \"$who/logs/daemon.log\" >&2; exit 1; }\ndone\n", "exit_code": 0, "kind": "run", "note": "", "output": "ALICE_GOT_CAROL_REPLY\nBOB_GOT_CAROL_REPLY\n", "status": "pass"}], "md": "### 6.4 Alice and Bob both receive Carol's reply\n\n```bash\nlogosctl --config-dir alice call chat_module get_messages \"$GROUP_ID\"\nlogosctl --config-dir bob   call chat_module get_messages \"$GROUP_ID\"\n```\n\nThe newest member's messages reach the founding members and vice\nversa: all three instances share one MLS group at one epoch, and\nevery message is end-to-end encrypted and sender-attributed."}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\nok=\"\"\nfor i in $(seq 1 60); do\n  row=$(./logos/bin/logosctl --config-dir alice call chat_module get_messages \"$gid\" 2>/dev/null | jq -c '.result[]? | select(.content == \"hello-group\")' || true)\n  if printf '%s' \"$row\" | jq -e '.delivered == true and (.message_id | type) == \"string\"' >/dev/null 2>&1; then\n    ok=1; echo \"ALICE_HELLO_DELIVERED\"; break\n  fi\n  sleep 4\ndone\n[ -n \"$ok\" ] || { echo \"alice's message was never reported delivered: $row\" >&2; exit 1; }\n", "exit_code": 0, "kind": "run", "note": "", "output": "ALICE_HELLO_DELIVERED\n", "status": "pass"}], "md": "### 6.5 Alice sees her message delivered\n\n```bash\n# hello-group now reads \"delivered\": true\nlogosctl --config-dir alice call chat_module get_messages \"$GROUP_ID\"\n```\n\nCarol's reply names the messages she had received, Alice's among\nthem, so Alice's instance learns that another member received\nhello-group and raises `message_delivered`. In a group that comes with\nthe first member who received the message, not the last, and says\nnothing of whether anyone read it."}, {"execs": [{"cmd": "gid=$(cat group-id.txt)\na=$(cat alice-addr.txt); c=$(cat carol-addr.txt)\nfor who in alice bob carol; do\n  me=$(cat \"${who}-addr.txt\")\n  ok=\"\"\n  for i in $(seq 1 60); do\n    data=$(./logos/bin/logosctl --config-dir \"$who\" call chat_module get_debug_data \"$gid\" 2>/dev/null || true)\n    if printf '%s' \"$data\" | jq -e --arg a \"$a\" --arg c \"$c\" --arg me \"$me\" '\n        [.result.value.members[]?] as $rows\n        | ([$a, $c, $me] | unique | length) as $want\n        | ([$rows[] | select(.account | IN($a, $c, $me)) | select(.sync == \"synced\")] | length) == $want\n          and all($rows[]; .sync != \"forked\")' >/dev/null 2>&1; then\n      ok=1; echo \"$(echo \"$who\" | tr a-z A-Z)_SEES_SENDERS_SYNCED\"; break\n    fi\n    sleep 4\n  done\n  [ -n \"$ok\" ] || { echo \"$who never saw the senders synced: $data\" >&2; exit 1; }\ndone\n", "exit_code": 0, "kind": "run", "note": "", "output": "ALICE_SEES_SENDERS_SYNCED\nBOB_SEES_SENDERS_SYNCED\nCAROL_SEES_SENDERS_SYNCED\n", "status": "pass"}], "md": "### 6.6 Each member sees the senders on its own state\n\n```bash\n# Alice, Carol and the member asking read \"sync\": \"synced\"\nlogosctl --config-dir alice call chat_module get_debug_data \"$GROUP_ID\"\nlogosctl --config-dir bob   call chat_module get_debug_data \"$GROUP_ID\"\nlogosctl --config-dir carol call chat_module get_debug_data \"$GROUP_ID\"\n```\n\nEach entry of `members` names the member's `account` and their\n`sync` against this instance: `synced`, `behind`, `ahead`, `forked`,\nor `unconfirmed` until it has heard from them. A GroupV3 message\ncarries its sender's epoch data, so every member reads Alice and\nCarol, who have sent, as `synced`. An instance's own entry is always\n`synced`."}, {"execs": [], "md": "## Step 7: Stop the daemons"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir alice daemon stop || true\n./logos/bin/logosctl --config-dir bob   daemon stop || true\n./logos/bin/logosctl --config-dir carol daemon stop || true\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.1 Shut all three down gracefully\n\n```bash\nlogosctl --config-dir alice daemon stop\nlogosctl --config-dir bob   daemon stop\nlogosctl --config-dir carol daemon stop\n```\n\nAlways stop through the control socket rather than killing processes: `daemon stop` unloads the daemon's modules and returns once it has exited."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>

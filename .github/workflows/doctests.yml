name: Doc-Tests

# Runs chat_module's usage doc-tests via the shared doctest CLI, against the
# commit under test. Each spec is an executable tutorial that builds this
# module's `.lgx`, loads it into headless `logoscore` daemons, and drives a real
# exchange over the live delivery network: the two-instance 1:1 round-trip and
# the three-instance GroupV2 conversation. Because they exercise the module end
# to end, the job also serves as an integration check and fails if an exchange
# does not complete.
#
# The Linux leg runs several real delivery instances on one host (distinct data
# dirs) and needs outbound network to reach the logos.test Waku fleet. The
# Windows leg loads chat and delivery in a staged native logoscore host, calls
# status(), and publishes its own offline execution report.

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: doctests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doctests:
    name: doc-tests (ubuntu-latest)
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      # Resolve the commit under test. For pull requests this is the PR's head
      # commit (not the synthetic merge commit); for pushes it's the pushed commit.
      # Passed to --release-for so the doc-test builds chat_module against THIS
      # commit instead of latest master. A fork PR's head commit resolves as
      # github:logos-co/logos-chat-module/<sha> too.
      - name: Resolve commit under test
        id: commit
        shell: bash
        run: |
          echo "sha=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"

      # Pre-build the closures the spec builds inline, so its bash steps hit the
      # nix store instead of compiling under the run (and inside its poll budgets).
      # chat_module#lgx (libchat + openssl from source) is the heavy, uncached one
      # (it's the commit under test); logoscore / delivery / lgpm should be attic
      # hits.
      - name: Pre-build doc-test closures
        shell: bash
        run: |
          ref="github:logos-co/logos-chat-module/${{ steps.commit.outputs.sha }}"
          nix build --no-link "$ref#lgx" -L
          nix build --no-link "$ref#delivery_module-lgx" -L
          nix build --no-link 'github:logos-co/logos-logoscore-cli' -L
          nix build --no-link 'github:logos-co/logos-package-manager#cli' -L

      # The runner is the shared `doctest` CLI invoked via its flake. --release-for
      # pins the {release} placeholder for logos-chat-module to the commit under
      # test, so `github:logos-co/logos-chat-module{release}#lgx` in the spec builds
      # this PR/push. --continue-on-fail so the run walks every step and the report
      # is complete; the job still exits non-zero if any step failed.
      - name: Run doc-tests
        run: |
          nix run github:logos-co/logos-doctest -- run \
            doctests/chat-module-exchange.test.yaml \
            doctests/chat-module-group.test.yaml \
            --verbose \
            --continue-on-fail \
            --release-for logos-chat-module=${{ steps.commit.outputs.sha }} \
            --report "${{ runner.temp }}/chat-module-doctest-report.html"

      - name: Stage report for upload
        if: always()
        shell: bash
        run: |
          mkdir -p report-out
          if [ -f "${{ runner.temp }}/chat-module-doctest-report.html" ]; then
            cp "${{ runner.temp }}/chat-module-doctest-report.html" report-out/index.html
          else
            echo "<h1>No report produced</h1>" > report-out/index.html
          fi

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-module-doctest-report-ubuntu-latest
          path: report-out/index.html
          if-no-files-found: warn

      - name: Verify markdown generation
        run: |
          for spec in chat-module-exchange chat-module-group chat-module-windows; do
            out="${{ runner.temp }}/${spec}.md"
            nix run github:logos-co/logos-doctest -- generate \
              "doctests/${spec}.test.yaml" \
              --release-for logos-chat-module=${{ steps.commit.outputs.sha }} \
              -o "$out"
            test -s "$out"
          done
          echo "Generated markdown successfully"

  windows:
    # The same shared runner used for delivery: build on Linux, execute the
    # Windows section of the spec natively, and upload its HTML report.
    uses: logos-co/logos-windows-ci/.github/workflows/windows-ci.yml@v1
    secrets: inherit
    with:
      targets: >-
        default lgx-portable install-portable
        delivery_module-default delivery_module-install-portable
      extra-targets: >-
        {"windows-logoscore": {
          "ref": "github:logos-co/logos-logoscore-cli#packages.x86_64-windows.cli-bundle-dir",
          "omit": ["lib/qt-6/plugins"]
        }}
      assemble: >-
        {"install-portable": ["default/lib", "windows-logoscore/bin"],
         "delivery_module-install-portable": ["delivery_module-default/lib", "windows-logoscore/bin"]}
      doctest-spec: doctests/chat-module-windows.test.yaml
      doctest-artifact: chat-module-doctest-report
      lgx-variant: true
      cold-derivation-budget: 120
      timeout-minutes: 90

  publish-report:
    name: Publish doc-test reports
    needs: [doctests, windows]
    # Run even when the doc-test fails: a failing run is exactly when you want the
    # report. Skip on forks, where GITHUB_TOKEN can't push or comment.
    if: ${{ always() && github.event.pull_request.head.repo.fork != true }}
    runs-on: ubuntu-latest

    permissions:
      contents: write          # push to the gh-pages branch
      pull-requests: write      # post/update the PR comment

    # Serialize Pages pushes so two refs can't race on the gh-pages branch.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: chat-module-doctest-report-*

      - name: Arrange site directory
        id: arrange
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="pr-${{ github.event.pull_request.number }}"
          else
            BASE="master"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          mkdir -p "site/$BASE"
          found=""
          for os in ubuntu-latest windows-latest; do
            src="artifacts/chat-module-doctest-report-$os/index.html"
            if [ -f "$src" ]; then
              mkdir -p "site/$BASE/$os"
              cp "$src" "site/$BASE/$os/index.html"
              found="$found $os"
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

          {
            echo "<!doctype html><meta charset=utf-8>"
            echo "<title>chat-module doc-test reports — $BASE</title>"
            echo "<style>body{font:16px system-ui;margin:40px;max-width:640px}a{color:#2563eb}</style>"
            echo "<h1>chat-module doc-test reports</h1>"
            echo "<p><strong>$BASE</strong> · commit <code>${GITHUB_SHA::7}</code></p><ul>"
            for os in ubuntu-latest windows-latest; do
              if [ -d "site/$BASE/$os" ]; then
                echo "<li><a href=\"./$os/\">$os</a></li>"
              fi
            done
            echo "</ul>"
          } > "site/$BASE/index.html"

      - name: Deploy to gh-pages
        if: steps.arrange.outputs.found != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true          # don't wipe other PRs' directories
          commit_message: "Publish doc-test report for ${{ steps.arrange.outputs.base }} (${{ github.sha }})"

      # Post the comment even if the Pages deploy had trouble, so the links are
      # always surfaced (it resolves once Pages is enabled for the repo, one time,
      # to deploy from the gh-pages branch).
      - name: Comment on PR with the report links
        if: ${{ always() && github.event_name == 'pull_request' && steps.arrange.outputs.found != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const base = "${{ steps.arrange.outputs.base }}";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const root = `https://${owner}.github.io/${repo}/${base}`;
            const oses = "${{ steps.arrange.outputs.found }}".trim().split(/\s+/).filter(Boolean);
            const links = oses.map(os => `- [\`${os}\` report](${root}/${os}/)`).join("\n");
            const marker = "<!-- chat-module-doctest-report-link -->";
            const body =
              `${marker}\n` +
              `### chat-module doc-test reports\n\n` +
              `Ubuntu runs the live 1:1 and group exchanges; Windows loads and ` +
              `calls the staged chat module with its delivery dependency. ` +
              `Reports show the commands and output for this commit ` +
              `(\`${context.sha.slice(0,7)}\`):\n\n` +
              `${links}\n\n` +
              `_Pages can take a minute to update after the run finishes._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
            }
